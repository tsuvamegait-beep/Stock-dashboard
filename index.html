<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주식 투자 대시보드</title>
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#f8f4ec">
<script>/* 저장된 테마 적용(없거나 모르는 값이면 리포트). 테마 목록은 아래 THEMES와 맞출 것: [id, 어두운가, 상단바 색] */
/* RPG 테마만 쓰는 픽셀 글꼴(갈무리)은 그 테마일 때만 불러옴 */
window.__themeFont=function(id){if(id!=="rpg"||document.getElementById("font-rpg"))return;var l=document.createElement("link");l.id="font-rpg";l.rel="stylesheet";l.href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css";document.head.appendChild(l)};
(function(){var L=[["light",0,"#f8f4ec"],["night",1,"#12182a"],["rpg",1,"#3d2a1c"]],t=null;try{t=localStorage.getItem("portfolio-theme")}catch(e){}
var th=L.filter(function(x){return x[0]===t})[0]||L[0];document.documentElement.setAttribute("data-theme",th[0]);__themeFont(th[0]);
document.querySelector('meta[name="color-scheme"]').setAttribute("content",th[1]?"dark":"only light");document.querySelector('meta[name="theme-color"]').setAttribute("content",th[2])})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: header with tabs, then one column. 보유 현황 leads with the total, composition strips and a holdings bar chart,
   then the holdings table grouped by the chosen view (전체, 계좌별, 통화별). Data lives in the page database; prices are written there by Claude or typed in. */
/* 기본(라이트) = 리포트 디자인: 크림 종이 + 남색 잉크 + 명조 총액 + 고정폭 숫자. 손익은 한국식(오름 빨강, 내림 파랑). */
:root{
  --plane:oklch(97% .012 85); --surface:oklch(98.5% .008 85); --ink:oklch(24% .04 260); --ink2:oklch(42% .03 260); --muted:oklch(55% .02 260);
  --grid:oklch(90% .015 85); --axis:oklch(80% .02 85); --hair:oklch(24% .04 260 / .12); --wash:oklch(24% .04 260 / .05);
  --s1:oklch(38% .12 260); --s2:oklch(62% .15 45); --s3:oklch(55% .1 165); --s4:oklch(72% .13 85); --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --accent:oklch(38% .12 260); --field:oklch(99.5% .004 85); --warn-bg:oklch(94% .04 85); --warn-ink:oklch(40% .08 70);
  --up:oklch(52% .2 25); --dn:oklch(48% .17 255);
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Noto Serif KR","Apple SD Gothic Neo",serif;
  color-scheme:only light;
}
:root[data-theme="light"]{color-scheme:only light}

/* 밤의 리포트(어두움): 리포트의 남색을 바탕으로 뒤집고 크림 글씨 + 황동 포인트 */
:root[data-theme="night"]{
  --plane:oklch(17% .025 260); --surface:oklch(20.5% .028 260); --ink:oklch(93% .015 85); --ink2:oklch(80% .02 85); --muted:oklch(65% .02 260);
  --grid:oklch(28% .03 260); --axis:oklch(38% .03 260); --hair:oklch(93% .015 85 / .14); --wash:oklch(93% .015 85 / .06);
  --s1:oklch(72% .12 250); --s2:oklch(74% .14 50); --s3:oklch(72% .11 165); --s4:oklch(82% .12 85); --s5:#d55181; --s6:#3fae5a; --s7:#9085e9; --s8:#e66767;
  --accent:oklch(80% .11 80); --field:oklch(15% .02 260); --warn-bg:oklch(27% .04 80); --warn-ink:oklch(86% .09 85);
  --up:oklch(70% .19 25); --dn:oklch(72% .14 245); color-scheme:dark;
}

/* RPG(도스 게임 감성): 짙은 나무색 바탕 + 양피지 창 + 금색 입체 테두리, 갈무리 픽셀 글꼴 */
:root[data-theme="rpg"]{
  --plane:oklch(30% .05 55); --surface:oklch(90% .045 85); --ink:oklch(93% .04 85); --ink2:oklch(84% .05 80); --muted:oklch(74% .05 75);
  --grid:oklch(40% .05 60); --axis:oklch(58% .07 65); --hair:oklch(93% .04 85 / .25); --wash:oklch(93% .04 85 / .1);
  --s1:oklch(48% .12 255); --s2:oklch(58% .15 45); --s3:oklch(55% .12 145); --s4:oklch(70% .14 85); --s5:oklch(55% .13 350); --s6:oklch(50% .1 180); --s7:oklch(45% .1 300); --s8:oklch(50% .17 28);
  --accent:oklch(80% .14 85); --field:oklch(22% .04 55); --warn-bg:oklch(90% .045 85); --warn-ink:oklch(35% .07 50);
  --up:oklch(72% .18 28); --dn:oklch(75% .12 240);
  --gold:oklch(76% .13 82); --gold-hi:oklch(92% .09 92); --gold-lo:oklch(52% .1 70); --wood-dk:oklch(20% .04 50);
  --font:"Galmuri11",monospace; --num:"GalmuriMono11","Galmuri11",monospace; --serif:"Galmuri14","Galmuri11",monospace;
  color-scheme:dark;
}
:root[data-theme="rpg"] body{background-image:conic-gradient(oklch(0% 0 0 / .14) 25%,transparent 0 50%,oklch(0% 0 0 / .14) 0 75%,transparent 0);background-size:4px 4px;-webkit-font-smoothing:none}
:root[data-theme="rpg"] *{border-radius:0!important}
/* 양피지 창 안쪽은 글자색을 짙은 갈색으로 바꿔 씀 */
:root[data-theme="rpg"] :is(.card,.banner,#tip){--ink:oklch(28% .05 50);--ink2:oklch(38% .05 50);--muted:oklch(48% .05 55);--axis:oklch(62% .06 65);--grid:oklch(80% .04 80);--hair:oklch(28% .05 50 / .22);--wash:oklch(28% .05 50 / .07);--accent:oklch(48% .12 60);--field:oklch(95% .03 85);--up:oklch(50% .2 28);--dn:oklch(45% .16 255);color:var(--ink)}
:root[data-theme="rpg"] :is(.card,.banner){background:var(--surface);border:3px solid var(--gold);box-shadow:0 0 0 3px var(--wood-dk),inset 2px 2px 0 var(--gold-hi),inset -2px -2px 0 oklch(72% .06 75),7px 7px 0 3px oklch(0% 0 0 / .35);padding:14px;margin:3px 10px 10px 3px}
:root[data-theme="rpg"] .card .card{box-shadow:none;border-width:2px;margin:0}
:root[data-theme="rpg"] :is(h1,.hero-fig){letter-spacing:0}
:root[data-theme="rpg"] h1{color:var(--gold);text-shadow:2px 2px 0 var(--wood-dk),3px 3px 0 oklch(0% 0 0 / .4)}
:root[data-theme="rpg"] .hero-fig{font-size:clamp(30px,9vw,48px);text-shadow:2px 2px 0 oklch(80% .08 85)}
:root[data-theme="rpg"] h2::before{content:"◆ ";color:var(--gold-lo)}
:root[data-theme="rpg"] .top{border-bottom:3px solid var(--gold);box-shadow:0 3px 0 var(--wood-dk)}
:root[data-theme="rpg"] .tile{border:2px solid var(--axis);background:oklch(86% .05 80);box-shadow:inset 1px 1px 0 var(--gold-hi);padding:8px 10px}
:root[data-theme="rpg"] .tile .v{font-weight:400;letter-spacing:-.03em;font-size:clamp(13px,3.9vw,20px)}
:root[data-theme="rpg"] :is(button,.btn,input[type=text],select,.seg){border-width:2px}
:root[data-theme="rpg"] :is(button.primary,.tabs button[aria-selected=true],.seg button[aria-pressed=true]){background:var(--gold);color:var(--wood-dk);border-color:var(--wood-dk);box-shadow:inset 2px 2px 0 var(--gold-hi),inset -2px -2px 0 var(--gold-lo)}
:root[data-theme="rpg"] button.primary:active{box-shadow:inset 2px 2px 0 var(--gold-lo),inset -2px -2px 0 var(--gold-hi);transform:translate(1px,1px)}
:root[data-theme="rpg"] .tabs{gap:4px;border-bottom:3px solid var(--gold-lo)}
:root[data-theme="rpg"] .tabs button{border:2px solid transparent}
:root[data-theme="rpg"] .tabs button[aria-selected=true]{border-color:var(--wood-dk)}
:root[data-theme="rpg"] .bar{gap:3px}
:root[data-theme="rpg"] :is(.seg-i,.hr .b){-webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px)}
:root[data-theme="rpg"] #toast{background:var(--wood-dk);color:var(--gold-hi);border:2px solid var(--gold)}
:root[data-theme="rpg"] svg{shape-rendering:crispEdges}
.rs-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--axis);color:var(--ink2);white-space:nowrap}
.rs-badge.up{color:var(--up);border-color:var(--up)}
.rs-badge.down{color:var(--dn);border-color:var(--dn)}
/* 테마 선택 카드 */
.thm{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.thm button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:12px;border-radius:8px;border:1px solid var(--axis);background:var(--surface);width:100%}
.thm button[aria-checked=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.thm .sw4{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--hair);height:34px;width:100%}
.thm .sw4 i{flex:1}
.thm .nm{font-weight:700;font-size:14px;color:var(--ink)}
.thm .ds{font-size:12px;color:var(--ink2);line-height:1.5}
.thm .tg{font-size:11px;color:var(--accent);font-weight:500}
*{box-sizing:border-box}
body{background:var(--plane);color:var(--ink);font:14px/1.6 var(--font);padding-inline:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:1120px;margin:0 auto;padding-block:24px 64px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.02em}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:14px;font-weight:700}
.meta,.sub{color:var(--ink2);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.top .meta{margin-top:2px}
button,.btn{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--axis);border-radius:6px;padding:6px 12px;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background-color 120ms var(--ease-out),transform 120ms var(--ease-out)}
/* 움직임: 누를 때 살짝 눌림(0.97), 마우스가 있는 기기에서만 hover 색. 탭·구간 버튼은 자주 누르므로 눌림 없음 */
:root{--ease-out:cubic-bezier(.23,1,.32,1)}
@media (hover:hover){button:hover{background:var(--wash)}}
button:active:not(:disabled){transform:scale(.97)}
.tabs button:active,.seg button:active{transform:none}
#toast:not([hidden]){animation:toast-in 180ms var(--ease-out)}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500;border-radius:2px}
button.primary:hover{filter:brightness(1.08);background:var(--accent)}
button.danger{color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],select{font:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--axis);border-radius:6px;padding:6px 9px;min-width:0;font-variant-numeric:tabular-nums}
input::placeholder{color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:8px 12px;font-size:12px}
[hidden]{display:none!important}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hair);overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 12px;color:var(--ink2);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
/* 카드: 테두리 상자 대신 위쪽 진한 줄로 구역을 나눔 */
.card{background:transparent;border:0;border-top:1px solid var(--ink);border-radius:0;padding:14px 0;min-width:0}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 12px;color:var(--ink2);white-space:nowrap}
@media (max-width:420px){.seg button{padding:5px 9px}}
.seg button+button{border-left:1px solid var(--axis)}
.seg button[aria-pressed=true]{background:var(--wash);color:var(--ink);font-weight:500}
.tlabel{font-size:12px;color:var(--muted);margin-right:6px}
.hero-k{font-size:12px;color:var(--ink2)}
.hero-fig{font-family:var(--serif);font-size:clamp(36px,10vw,56px);font-weight:700;letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}
.hero-n{font-size:13px;color:var(--ink2);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:transparent;border:0;border-left:2px solid var(--hair);border-radius:0;padding:4px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .l{font-size:12px;color:var(--ink2)}
.tile .v{font-family:var(--num);font-size:clamp(16px,4.4vw,22px);font-weight:600;letter-spacing:-.02em;overflow-wrap:anywhere}
/* 숫자는 자릿수가 맞는 고정폭 글꼴, 손익은 한국식 색 */
td:not(.l),.hr .vl,.donut-lg .am{font-family:var(--num);font-variant-numeric:tabular-nums}
.gain{color:var(--up)}.loss{color:var(--dn)}
.tile .n{font-size:12px;color:var(--muted)}
.tiles.one{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tiles.one .pair{align-items:stretch;text-align:left;padding:8px 6px;justify-content:center}
.tiles.one .pr{white-space:nowrap;font-size:clamp(10px,2.9vw,13px);line-height:1.6;overflow:hidden}
.tiles.one .pr .k{color:var(--ink2)}
.tiles.one .pr .pv{font-weight:700;letter-spacing:-.03em}
.tiles.one .tile{padding:8px 2px;align-items:center;text-align:center;gap:3px}
.tiles.one .l{font-size:clamp(10px,2.9vw,12px);white-space:nowrap}
.tiles.one .v{font-size:clamp(10px,2.85vw,19px);max-width:100%;text-overflow:clip;letter-spacing:-.04em}
.tiles.one .c{display:none}
@media (max-width:340px){.tiles.one .v{font-size:9px}.tiles.one .l{font-size:9px}}
@media (max-width:640px){.tiles.one .f{display:none}.tiles.one .c{display:inline}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
/* strips */
.strip+.strip{margin-top:14px}
.strip-t{font-size:12px;color:var(--ink2);margin-bottom:6px}
.bar{display:flex;gap:2px;height:14px}
.seg-i{border-radius:3px;min-width:2px}
.seg-i:hover,.seg-i:focus-visible{filter:brightness(1.12)}
.donut-w{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-lg{flex:1;min-width:220px;max-width:460px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.donut-lg .r{display:flex;align-items:center;gap:8px;min-width:0}
.donut-lg .r .nm{font-weight:500}
.donut-lg .r .am{margin-left:auto;color:var(--ink2);white-space:nowrap}
.donut-lg .r .st{display:block;font-size:11px;color:var(--muted);white-space:normal}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
/* horizontal bars */
.hb{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.hr{display:grid;grid-template-columns:minmax(64px,128px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px;border-radius:4px;padding:1px 0}
.hr:hover{background:var(--wash)}
.hr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr .tr{position:relative;height:14px}
.hr .b{position:absolute;top:0;height:14px}
.hr .z{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--axis)}
.hr .vl{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* tables */
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:right;padding:6px 10px;border-bottom:1px solid var(--axis);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:top}
th.l,td.l{text-align:left}
tbody tr:hover{background:var(--wash)}
tr.subtotal td{font-weight:700;background:var(--wash)}
td .s2{display:block;font-size:11px;color:var(--muted);font-weight:400}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;align-items:baseline;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:6px}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tag{font-size:11px;color:var(--ink2);border:1px solid var(--axis);border-radius:4px;padding:0 6px;margin-left:6px;white-space:nowrap}
.tag.warn{color:var(--warn-ink);background:var(--warn-bg);border-color:transparent}
td input{width:104px;text-align:right;padding:4px 8px;font-size:13px}
td input.tk{width:110px;text-align:left}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:8px 2px}
.steps{margin:0;padding-left:18px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.note{font-size:12px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--wash);border-radius:4px;padding:2px 6px}
.facts{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--warn-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.fxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fxg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:6px;font-size:13px;z-index:30;max-width:90vw}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);max-width:260px}
#tip .tt{color:var(--ink2);margin-bottom:4px}
#tip .tr2{display:flex;align-items:center;gap:7px;line-height:1.7}
#tip .tr2 strong{font-weight:700;font-variant-numeric:tabular-nums}
#tip .k{width:9px;height:9px;border-radius:2px;flex:none}
/* 선 그래프: 화면 폭에 맞춰 늘어나도 선 두께는 항상 같은 픽셀(PC에서 굵어지지 않게) */
svg :is(polyline,line){vector-effect:non-scaling-stroke}

<script>
/* 삼성증권 종합 거래내역 -> 계좌 데이터. 브라우저와 Node에서 같은 코드를 씁니다. */
const MK_CODE = {'미국': 'US', '일본': 'JP', '홍콩': 'HK', '중국': 'CN', '베트남': 'VN', '영국': 'UK', '독일': 'DE', '프랑스': 'FR', '캐나다': 'CA', '호주': 'AU'};
const FX_NAMES = ['외화매도', '외화매수', '시간외 외화매도', '시간외 외화매수', '시간외환전정산차금입금'];
const TRADE_RE = /^(?:([^\s(]+)\(([^)]+)\))?주식(매수|매도)$|^(매수|매도)(?:_\w+)?$/;

/* 종목 이름을 저장소 문서 id로 쓰기 위한 짧은 키 */
function keyOf(name) { let h = 0x811c9dc5; for (let i = 0; i < name.length; i++) { h ^= name.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return 'k' + h.toString(16) + 'x' + name.length.toString(36); }
function stockLabel(s) { return String(s).replace(/^(USD|JPY|HKD|CNY|EUR|GBP)\s+/, ''); }
function toNum(v) { const x = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(x) ? x : 0; }

/* rows: 2차원 배열(문자열). 헤더 행 위에 있는 제목 행에서 조회 기간과 기준일을 읽습니다. */
function parseSamsungRows(rows) {
  let hdr = -1;
  for (let i = 0; i < Math.min(15, rows.length); i++) {
    if (rows[i].some(c => String(c).trim() === '거래일자')) { hdr = i; break; }
  }
  if (hdr < 0) throw new Error('거래일자 컬럼을 찾지 못했습니다. 삼성증권 종합 거래내역 엑셀이 맞는지 확인하세요.');
  const title = rows.slice(0, hdr).reduce((a, r) => a.concat(r), []).filter(x => typeof x === 'string').join(' ');
  const cols = rows[hdr].map(c => String(c).trim());
  const ix = {}; cols.forEach((c, i) => { if (!(c in ix)) ix[c] = i; });
  const rawStr = (r, n) => (n in ix && r[ix[n]] != null) ? String(r[ix[n]]).trim() : '';
  const rawNum = (r, n) => toNum(rawStr(r, n));
  const data = [];
  for (let i = hdr + 1; i < rows.length; i++) {
    const r = rows[i], d = rawStr(r, '거래일자');
    if (!/^\d{4}-\d{2}-\d{2}/.test(d)) continue;
    data.push({
      d: d.slice(0, 10), nm: rawStr(r, '거래명'), s: rawStr(r, '종목명'), ccy: rawStr(r, '통화코드'), n: Math.round(rawNum(r, '거래번호')),
      qty: rawNum(r, '거래수량'), amt: rawNum(r, '거래금액'), tax: rawNum(r, '제세금/대출이자'), cash: rawNum(r, '현금잔액'),
      px: rawNum(r, '거래단가'), fee: rawNum(r, '수수료/Fee'), bal: rawNum(r, '잔고수량/펀드평가금액'),
      fxSettle: rawNum(r, '외화정산금액'), fxAmt: rawNum(r, '외화거래금액'), fxCash: rawNum(r, '외화예수금액')
    });
  }
  if (!data.length) throw new Error('거래 행을 찾지 못했습니다.');
  data.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.n - b.n);

  const warn = [];
  const m1 = title.match(/(\d{4})\.(\d{2})\.(\d{2})\s*~\s*(\d{4})\.(\d{2})\.(\d{2})/);
  const m2 = title.match(/\/\s*(\d{4})\.(\d{2})\.(\d{2})\s+\d{2}:\d{2}/);
  const firstRow = data[0].d, lastTrade = data[data.length - 1].d;
  const p0 = m1 ? m1[1] + '-' + m1[2] + '-' + m1[3] : firstRow;
  const p1 = m1 ? m1[4] + '-' + m1[5] + '-' + m1[6] : lastTrade;
  const asof = m2 ? m2[1] + '-' + m2[2] + '-' + m2[3] : (p1 > lastTrade ? p1 : lastTrade);
  const year = +p0.slice(0, 4);
  if (p0.slice(5) !== '01-01') warn.push('조회 기간이 ' + p0 + '부터 시작해서 연초부터 그 전날까지의 거래가 빠져 있습니다. 1월 1일부터 다시 내려받으세요.');
  if (+p1.slice(0, 4) !== year) warn.push('조회 기간이 두 해에 걸쳐 있습니다. ' + year + '년 기준으로만 계산합니다.');

  const unknown = {}; const bump = k => { unknown[k] = (unknown[k] || 0) + 1; };
  const trades = [], inkindRows = [], divRows = [], ext = [];
  data.forEach(r => {
    const nm = r.nm;
    if (nm === '이체입금' || nm === '이체출금') ext.push({d: r.d, kind: nm === '이체입금' ? 'in' : 'out', amt: Math.round(r.amt)});
    else if (nm === '대체입고' || nm === '대체출고') {
      if ((r.ccy && r.ccy !== 'KRW') || /^(USD|JPY)\s/.test(r.s)) bump(nm + '(외화 종목)'); else inkindRows.push(r);
    } else if (FX_NAMES.indexOf(nm) >= 0 || nm === '이용료입금' || nm === '세금출금(해외)') { /* 계좌 안의 이동이나 부수 항목 */ }
    else if (nm === '배당금입금') divRows.push(r);
    else {
      const t = TRADE_RE.exec(nm);
      if (t) {
        if (t[1] && (!r.ccy || r.ccy === 'KRW')) bump(nm + '(통화 없음)'); else trades.push(r);
      } else bump(nm);
    }
  });

  // 주문 단위로 묶기 (날짜, 종목, 매매 방향이 같으면 한 건)
  const groups = new Map();
  trades.forEach(r => {
    const t = TRADE_RE.exec(r.nm), side = (t[3] || t[4]) === '매수' ? 1 : -1, foreign = !!t[1];
    const key = r.d + '|' + r.s + '|' + side;
    let g = groups.get(key);
    if (!g) { g = {d: r.d, s: r.s, side, mk: foreign ? (MK_CODE[t[1]] || t[1]) : 'KR', ccy: foreign ? r.ccy : 'KRW', q: 0, g: 0, n: 0, fee: 0, tax: 0, bal: 0, _fx: foreign, _net: 0}; groups.set(key, g); }
    g.q += r.qty; g.n = Math.max(g.n, r.n); g.bal = r.bal;
    if (foreign) { g.g += r.fxAmt; g._net += r.fxSettle; } else { g.g += r.amt; g.fee += r.fee; g.tax += r.tax; }
  });
  const orders = [];
  groups.forEach(g => {
    if (g._fx) { g.fee = g.side === 1 ? g._net - g.g : g.g - g._net; g.net = g._net; }
    else g.net = g.side === 1 ? g.g + g.fee : g.g - g.fee - g.tax;
    orders.push({d: g.d, s: g.s, side: g.side, mk: g.mk, ccy: g.ccy, q: g.q, g: round(g.g, 4), n: g.n, net: round(g.net, 4), fee: round(g.fee, 4), tax: round(g.tax, 4), bal: g.bal});
  });
  orders.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.n - b.n);

  // 대체입출고
  const ik = new Map();
  inkindRows.forEach(r => {
    const sign = r.nm === '대체입고' ? 1 : -1, key = r.d + '|' + r.s + '|' + sign;
    let e = ik.get(key); if (!e) { e = {d: r.d, s: r.s, sign, q: 0, v: 0}; ik.set(key, e); }
    e.q += r.qty; e.v += r.qty * r.px;
  });
  const inkinds = []; ik.forEach(e => inkinds.push({d: e.d, s: e.s, sign: e.sign, q: e.q, px: e.q ? e.v / e.q : 0}));

  // 연초 수량: 마지막 체결 줄의 잔고에서 거꾸로 계산
  const finalbal = {}; orders.forEach(o => { finalbal[o.s] = o.bal; });
  const signed = {}; orders.forEach(o => { signed[o.s] = (signed[o.s] || 0) + o.side * o.q; });
  const ikq = {}; inkinds.forEach(e => { ikq[e.s] = (ikq[e.s] || 0) + e.sign * e.q; });
  const stocks = new Set(Object.keys(finalbal).concat(Object.keys(ikq)));
  const startQty = {};
  stocks.forEach(s => {
    if (s in finalbal) startQty[s] = finalbal[s] - (signed[s] || 0) - (ikq[s] || 0);
    else { startQty[s] = 0; warn.push(stockLabel(s) + ': 대체입출고 이후 거래가 없어 연초 수량을 0주로 가정했습니다.'); }
  });
  // 날짜별 마지막 잔고와 대조
  const ev = orders.map(o => ({d: o.d, s: o.s, side: o.side, q: o.q, n: o.n, ik: false, bal: o.bal}))
    .concat(inkinds.map(e => ({d: e.d, s: e.s, side: e.sign, q: e.q, n: -1, ik: true})));
  ev.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.n - b.n);
  const lastIdx = {}; ev.forEach((o, i) => { lastIdx[o.s + '|' + o.d] = i; });
  const bal = Object.assign({}, startQty); let mism = 0;
  ev.forEach((o, i) => { bal[o.s] += o.side * o.q; if (!o.ik && lastIdx[o.s + '|' + o.d] === i && Math.abs(bal[o.s] - o.bal) > 1e-6) mism++; });
  if (mism) warn.push('보유수량이 거래내역의 잔고와 맞지 않는 날이 ' + mism + '건 있습니다. 연초 수량과 평균단가를 확인하세요.');
  stocks.forEach(s => { if (startQty[s] < -1e-9) warn.push(stockLabel(s) + ': 연초 수량이 음수로 계산됐습니다. 조회 기간 이전 거래가 빠졌을 수 있습니다.'); });

  const divs = divRows.map(r => {
    const f = !!(r.ccy && r.ccy !== 'KRW');
    return {d: r.d, s: r.s, ccy: f ? r.ccy : 'KRW', gross: f ? r.fxSettle : r.amt, taxKRW: r.tax};
  });

  // 통화별 마지막 예수금
  const cash = {KRW: data[data.length - 1].cash};
  data.forEach(r => { if (r.ccy && r.ccy !== 'KRW') cash[r.ccy] = r.fxCash; });

  return {
    v: 1, year, asof, firstRow, lastTrade, orders, inkinds, ext, divs, startQty, cash, warn,
    unknown: Object.keys(unknown).map(k => ({name: k, n: unknown[k]}))
  };
}

/* ===== 나무증권(NH투자증권) 거래내역 -> 계좌 데이터 (삼성증권 파서와 같은 모양으로 반환) =====
   rows: 첫 줄(또는 위쪽 줄)에 실거래일자, 거래유형, 상세내용, 종목명 ... 제목이 있는 2차원 배열.
   입출금 내역은 거래내역에 이미 들어 있어서 따로 올릴 필요가 없습니다. */
const NAMOO_JPY_NAMES = ['간포생명보험'];
function parseNamooRows(rows) {
  let hdr = -1;
  for (let i = 0; i < Math.min(15, rows.length); i++) { const t = rows[i].map(c => String(c).trim()); if (t.indexOf('실거래일자') >= 0 && t.indexOf('거래유형') >= 0) { hdr = i; break; } }
  if (hdr < 0) throw new Error('실거래일자/거래유형 컬럼을 찾지 못했습니다. 나무증권 거래내역 엑셀이 맞는지 확인하세요.');
  const cols = rows[hdr].map(c => String(c).trim()), ix = {}; cols.forEach((c, i) => { if (!(c in ix)) ix[c] = i; });
  if (!('상세내용' in ix)) throw new Error('상세내용 컬럼이 없습니다. 입출금거래내역이 아니라 "거래내역" 파일을 올려 주세요(입출금은 거래내역에 포함돼 있습니다).');
  const sv = (r, n) => (n in ix && r[ix[n]] != null) ? String(r[ix[n]]).trim() : '';
  const nv = (r, n) => toNum(sv(r, n));
  let data = [];
  for (let i = hdr + 1; i < rows.length; i++) {
    const r = rows[i], d = sv(r, '실거래일자').replace(/\./g, '-');
    if (!/^\d{4}-\d{2}-\d{2}/.test(d)) continue;
    data.push({d: d.slice(0, 10), type: sv(r, '거래유형'), kind: sv(r, '상세내용'), s: sv(r, '종목명'), qty: nv(r, '수량'), px: nv(r, '단가'), amt: nv(r, '거래금액'), net: nv(r, '정산금액'), bal: nv(r, '잔고'), cash: nv(r, '예수금잔액'), fee: nv(r, '수수료'), tax: nv(r, '세금')});
  }
  if (!data.length) throw new Error('거래 행을 찾지 못했습니다.');
  if (data.length > 1 && data[0].d > data[data.length - 1].d) data.reverse(); // 최신순 파일 -> 오래된 순
  data.forEach((r, i) => { r.n = i + 1; });

  const warn = [], unknown = {}, bump = k => { unknown[k] = (unknown[k] || 0) + 1; };
  const trades = [], inkinds = [], divs = [], ext = [], lend = [];
  const jpy = {}; NAMOO_JPY_NAMES.forEach(s => { jpy[s] = 1; });
  data.forEach(r => { if (/^외화증권/.test(r.kind) && r.amt >= 50000 && r.px >= 500) jpy[r.s] = 1; });
  const ccyOf = s => jpy[s] ? 'JPY' : 'USD';
  const ledger = {USD: 0, JPY: 0};
  data.forEach(r => {
    const k = r.kind;
    if (/^외화증권(매수|매도)$/.test(k)) { const c = ccyOf(r.s); ledger[c] += (r.type === '매수' ? -1 : 1) * r.net; r._t = 1; trades.push(Object.assign({foreign: true}, r)); }
    else if (/^(코스피|KOSDAQ|코스닥|ETF|ETN)?(매수|매도)$/.test(k) && r.type !== '환전') { r._t = 1; trades.push(Object.assign({foreign: false}, r)); }
    else if (k === '외화매수' || k === '외화매도') { const c = r.amt / Math.max(r.net, 1) < 100 ? 'JPY' : 'USD'; ledger[c] += (k === '외화매수' ? 1 : -1) * r.net; }
    else if (k === '외화주식액면분할입고' || k === '외화주식액면분할출고') inkinds.push({d: r.d, s: r.s, sign: k.slice(-2) === '입고' ? 1 : -1, q: r.qty, px: r.px, n: -1});
    else if (k === '대여출고' || k === '대여상환입고') lend.push({d: r.d, s: r.s, sign: k === '대여출고' ? -1 : 1, q: r.qty, n: r.n});

/* 나무증권 엑셀은 확장자만 .xls이고 실제로는 HTML 표(한글 cp949)입니다. 그 경우 표를 직접 읽습니다. */
function htmlRows(buf) {
  const u8 = new Uint8Array(buf), head = new TextDecoder('latin1').decode(u8.slice(0, 400)).trim().toLowerCase();
  if (!(head.startsWith('<') && /<(html|table|meta|!doctype)/.test(head))) return null;
  // 한글 인코딩이 cp949(EUC-KR)일 수도, UTF-8일 수도 있어서 제목이 제대로 읽히는 쪽을 고릅니다.
  let txt = ''; for (const enc of ['euc-kr', 'utf-8']) { try { const s = new TextDecoder(enc).decode(u8); if (!txt) txt = s; if (/거래일자|거래유형|종목명/.test(s)) { txt = s; break; } } catch (e) {} }
  const doc = new DOMParser().parseFromString(txt, 'text/html'), tb = Array.from(doc.querySelectorAll('table')).sort((a, b) => b.rows.length - a.rows.length)[0];
  if (!tb) return null;
  return Array.from(tb.rows).map(tr => Array.from(tr.cells).map(c => c.textContent.replace(/\u00a0/g, ' ').trim()));
}

    mk('p', {class: 'sub'}, card, '매매 ' + a.A.orders.length + '건 · 보유 ' + a.H.filter(h => h.end > 1e-9).length + '종목 · 예수금 ' + Object.keys(a.A.cash).map(c => money(c, a.A.cash[c])).join(' ') + ' · ' + (acc.fileName || ''));
    if (a.A.warn.length || a.A.unknown.length) { const w = mk('ul', {class: 'facts'}, card); a.A.warn.forEach(x => mk('li', {}, w, x)); a.A.unknown.forEach(u => mk('li', {}, w, '분류하지 못한 거래 유형: ' + u.name + ' ' + u.n + '건')); }
    const need = a.H.filter(h => !h.known && (h.end > 1e-9 || h.sellQty > 0));
    if (need.length) { const nb = mk('div', {class: 'row', style: 'margin-top:12px'}, card); mk('span', {class: 'sub'}, nb, '연초부터 보유한 종목 ' + need.length + '건의 취득단가가 비어 있습니다.'); const go = mk('button', {type: 'button'}, nb, '연초 잔고 탭에서 입력'); go.addEventListener('click', () => { ui.tab = 'opening'; saveUi(); syncTabs(); render(); }); }
    const dz = mk('div', {class: 'row', style: 'margin-top:12px'}, card);
    if (ui.confirmDel === a.aid) {
      mk('span', {class: 'sub'}, dz, '이 계좌의 거래 데이터와 취득단가가 삭제됩니다. 계속할까요?');
      const y = mk('button', {type: 'button', class: 'danger'}, dz, '삭제'), n = mk('button', {type: 'button'}, dz, '취소');
      n.addEventListener('click', () => { ui.confirmDel = null; render(); });
      y.addEventListener('click', async () => { const ids = Object.keys(state.basis).filter(k => state.basis[k].acc === a.aid); for (const k of ids) await store.del('basis', k); const nm0 = a.name, ok = await store.del('accounts', a.aid); ui.confirmDel = null; if (ok) { toast('삭제했습니다'); deleteTradesOnSheet(nm0); } render(); });
    } else { const d = mk('button', {type: 'button'}, dz, '계좌 삭제'); d.addEventListener('click', () => { ui.confirmDel = a.aid; render(); }); }
  });
}

/* ================= 렌더 ================= */
let rq = 0, pendingAfterBlur = false;
function scheduleRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }
function render() {
  const ae = document.activeElement;
  if (ae && ae.tagName === 'INPUT' && ae.closest('#res-prices,#res-accounts,#res-opening,#res-rs,#res-ana,#res-an') && ae.type === 'text') { pendingAfterBlur = true; return; }
  const C = compute();
  $('banner').hidden = !(state.ready && !state.persist) && state.writable;
  if (state.ready && !state.persist) { $('banner').hidden = false; $('banner').textContent = '데이터는 이 브라우저에만 저장됩니다(다른 기기·브라우저와 공유되지 않고, 사이트 데이터를 지우면 사라집니다). 시세는 시세·환율 탭에서 구글 시트 주소를 연결하거나 직접 입력하세요.'; }
  else if (!state.writable) { $('banner').hidden = false; $('banner').textContent = '보기 전용으로 열렸습니다. 데이터를 올리거나 고치려면 페이지 소유자 계정으로 여세요.'; }
  const lastPrice = Object.keys(state.prices).map(k => state.prices[k].asof).filter(Boolean).sort().pop();
  $('meta').textContent = !state.ready ? '불러오는 중…' : (C.accts.length ? '계좌 ' + C.accts.length + '개 · 보유 ' + C.rows.length + '종목 · ' + (lastPrice ? '최근 시세 ' + ago(lastPrice) : '시세 없음') : '계좌가 없습니다');
  if (state.ready) { recordHistory(C); renderHoldings(C); renderDetail(C); renderRS(C); renderAna(C); renderTheme(); renderTrades(C); renderPrices(C); renderOpening(C); renderAccounts(C); }
}
document.addEventListener('focusout', () => { if (pendingAfterBlur) { pendingAfterBlur = false; setTimeout(render, 0); } });
function syncTabs() {
  if (!$('tab-' + ui.tab)) ui.tab = ui.tab === 'an' ? 'ana' : 'holdings'; // 없어진 "분석" 탭은 종목분석으로
  document.querySelectorAll('#tabs button').forEach(b => { const on = b.dataset.tab === ui.tab; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; if (on) b.scrollIntoView({block: 'nearest', inline: 'nearest'}); });
  ['holdings', 'detail', 'rs', 'ana', 'trades', 'prices', 'opening', 'accounts', 'theme'].forEach(t => { $('tab-' + t).hidden = t !== ui.tab; });
}
function syncSegs() {
  document.querySelectorAll('#seg-view button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === ui.view)));
  [['seg-cls', 'cls'], ['seg-cls2', 'cls'], ['seg-cls3', 'dcls']].forEach(([id, k]) => document.querySelectorAll('#' + id + ' button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c === ui[k]))));
}
(function init() {
  document.querySelectorAll('#tabs button').forEach(b => {
    b.id = 'tabbtn-' + b.dataset.tab; b.setAttribute('aria-controls', 'tab-' + b.dataset.tab);
    const p = $('tab-' + b.dataset.tab); p.setAttribute('role', 'tabpanel'); p.setAttribute('aria-labelledby', b.id);
    b.addEventListener('click', () => { ui.tab = b.dataset.tab; saveUi(); syncTabs(); });
  });
  // 키보드: 좌우 화살표·Home·End로 탭 이동
  $('tabs').addEventListener('keydown', e => {
    const bs = [...document.querySelectorAll('#tabs button')], i = bs.indexOf(document.activeElement); if (i < 0) return;
    const j = e.key === 'ArrowRight' ? (i + 1) % bs.length : e.key === 'ArrowLeft' ? (i - 1 + bs.length) % bs.length : e.key === 'Home' ? 0 : e.key === 'End' ? bs.length - 1 : -1;
    if (j < 0) return; e.preventDefault(); bs[j].click(); bs[j].focus();
  });
  document.querySelectorAll('#seg-view button').forEach(b => b.addEventListener('click', () => { ui.view = b.dataset.v; saveUi(); syncSegs(); render(); }));
  document.querySelectorAll('#seg-cls3 button').forEach(b => b.addEventListener('click', () => { ui.dcls = b.dataset.c; saveUi(); syncSegs(); render(); }));
  ['seg-cls', 'seg-cls2'].forEach(id => document.querySelectorAll('#' + id + ' button').forEach(b => b.addEventListener('click', () => { ui.cls = b.dataset.c; saveUi(); syncSegs(); render(); })));
  let qt; $('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { ui.q = e.target.value.trim(); render(); }, 150); });
  $('q3').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { ui.dq = e.target.value.trim(); render(); }, 150); });
  $('q2').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { ui.q2 = e.target.value.trim(); render(); }, 150); });
  $('sel-acct').addEventListener('change', e => { ui.acct = e.target.value; render(); });
  $('btnUpload').addEventListener('click', openUpload);
  $('file').addEventListener('change', e => handleFile(e.target.files[0]));
  $('file2').addEventListener('change', e => handleOpening(e.target.files[0]));
  $('file3').addEventListener('change', e => handleCredit(e.target.files[0]));
  syncTabs(); syncSegs(); render();
  loadSectors();
  store.init().then(async () => { if (!store.db) { await syncPull(); setTimeout(() => syncSheet(true), 50); } });
  let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => { if (state.ready) render(); }, 120); }).observe(document.body);
})();
</script>
