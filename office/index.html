<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주식 사무실</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14121f">
<style>
/* 도트 사무실: 짙은 남색 바탕 + 황동색 강조. 손익은 한국식(오름 빨강, 내림 파랑) */
:root{
  --bg:#14121f; --panel:#1e1b2e; --panel2:#262238; --line:#3a3452; --ink:#ece6d6; --ink2:#c7c0d8; --muted:#958eab;
  --accent:#c9a45c; --up:#ff6b5e; --dn:#5b9bff; --ok:#6fcf8f;
  --font:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--font);padding-inline:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding-block:18px 56px;display:flex;flex-direction:column;gap:14px}
h1,h2,p{margin:0}
h1{font-size:20px;letter-spacing:-.01em}
h2{font-size:15px}
.sub{color:var(--muted);font-size:12.5px}
a{color:var(--accent)}
.px{border:2px solid var(--line);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line);border-radius:2px;background:var(--panel)}
/* 무대: 캔버스(288×176)를 화면 폭에 맞춰 키움 */
.stage{position:relative;width:100%;aspect-ratio:288/176;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.spot{position:absolute;transform:translate(-50%,-50%);font:600 11px/1 var(--font);color:var(--ink);background:rgba(20,18,31,.82);border:1px solid var(--accent);
  border-radius:2px;padding:4px 6px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.spot:active{transform:translate(-50%,-50%) scale(.96)}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:62%;background:#fbf7ec;color:#1b1726;font:600 12px/1.35 var(--font);
  padding:5px 8px;border:2px solid #1b1726;border-radius:2px;pointer-events:none;transition:opacity 160ms;text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-4px;border:4px solid transparent;border-top-color:#1b1726}
[hidden]{display:none!important}
.bubble[hidden]{display:block!important;opacity:0}
.bar{display:flex;gap:8px}
.bar input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:2px;padding:9px 10px}
.bar input:focus{outline:none;border-color:var(--accent)}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.go{font-weight:700;color:#1b1726;background:var(--accent);border:2px solid var(--accent);border-radius:2px;padding:0 16px}
.go:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12.5px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:5px 9px}
.card{padding:14px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
@media (max-width:420px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv span{font-size:11.5px;color:var(--muted)}
.kv b{font:600 16px/1.3 var(--num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mults{display:flex;flex-direction:column;gap:3px;font:13px/1.5 var(--num)}
.mults div{display:flex;justify-content:space-between;gap:10px;padding:2px 6px;border-radius:2px}
.mults .now{background:var(--panel2);outline:1px solid var(--accent)}
.note{font-size:12px;color:var(--muted)}
.up{color:var(--up)} .dn{color:var(--dn)}
.err{color:var(--up)}
.log{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.log time{color:var(--muted);font-family:var(--num);margin-right:6px}
.btn{display:inline-block;text-decoration:none;color:#1b1726;background:var(--accent);font-weight:700;padding:7px 14px;border-radius:2px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--muted);font:10px var(--num)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<body>
<main class="wrap">
  <header>
    <h1>주식 사무실</h1>
    <p class="sub">비서에게 일을 시키면 해당 자리로 가서 처리해요. 장소를 눌러도 돼요.</p>
  </header>

  <div class="stage px" id="stage">
    <canvas id="cv" width="576" height="352" role="img" aria-label="큰 창문 너머로 도시가 보이는 밝은 실내 사무실에서 비서가 일하는 도트 그림"></canvas>
    <button type="button" class="spot" data-act="dash" style="left:21%;top:24%">📈 대시보드</button>
    <button type="button" class="spot" data-act="bt" style="left:61%;top:8%">🧪 백테스트</button>
    <button type="button" class="spot" data-act="fin" style="left:89%;top:31%">🗂 재무</button>
    <div class="bubble" id="bubble" hidden></div>
  </div>

  <form class="bar" id="cmdForm" autocomplete="off">
    <input id="cmd" type="text" placeholder="예: 삼성전자 재무, 백테스트, 대시보드" enterkeyhint="send">
    <button class="go" id="send">시키기</button>
  </form>
  <div class="chips" id="chips">
    <button type="button" data-q="삼성전자 재무">삼성전자 재무</button>
    <button type="button" data-q="SK하이닉스 PBR 밴드">SK하이닉스 PBR 밴드</button>
    <button type="button" data-q="백테스트">백테스트</button>
    <button type="button" data-q="대시보드">대시보드</button>
  </div>

  <section class="card px" id="result" hidden></section>

  <section class="card px">
    <h2>작업 기록</h2>
    <div class="log" id="log"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

/* ===== Apps Script(백테스트용과 같은 연결 — 백테스트 페이지에서 연결한 주소·비밀번호를 같이 씀) ===== */
const getSync = () => { const o = lsGet('backtest-sync', null); return o && o.url && o.key ? o : null; };
async function api(params) {
  const s = getSync(); if (!s) throw new Error('먼저 백테스트 페이지에서 Apps Script를 연결해 주세요');
  const res = await fetch(s.url + (s.url.indexOf('?') >= 0 ? '&' : '?') + 'key=' + encodeURIComponent(s.key) + '&' + params, {cache: 'no-store'});
  let j; try { j = await res.json(); } catch (e) { throw new Error('Apps Script 응답을 읽지 못했습니다(새 버전으로 배포했는지 확인)'); }
  if (!j.ok) throw new Error(j.error || '실패');
  return j;
}
async function universe() { // 백테스트 페이지가 받아 둔 종목 목록을 같이 씀
  const c = lsGet('backtest-univ', null);
  if (c && c.list && c.list.length) return c.list;
  const j = await api('universe=1');
  lsSet('backtest-univ', {at: '', list: j.list});
  return j.list;
}
async function findStock(q) {
  const T = q.toUpperCase().replace(/\s/g, ''); if (!T) return null;
  const list = await universe(), nm = r => r[1].replace(/\s/g, '').toUpperCase();
  return list.find(r => r[0] === T) || list.find(r => nm(r) === T) || list.filter(r => nm(r).startsWith(T)).sort((a, b) => a[1].length - b[1].length)[0]
    || list.filter(r => nm(r).indexOf(T) >= 0).sort((a, b) => a[1].length - b[1].length)[0] || null;
}

/* ===== 도트 그림 =====
 * 좌표는 288×176 칸 기준이고 실제 캔버스는 2배(576×352)라, 0.5 단위로 잔무늬를 넣을 수 있음. CSS로 화면 폭에 맞춰 키움.
 * 위에서 비스듬히 내려다본 밝은 실내 사무실. 위쪽 벽의 큰 창문 너머로 낮의 도시가 보임(고층 사무실).
 * 배경은 한 번만 그려 두고, 매 프레임 창밖 구름·모니터·시계와 비서만 다시 그림 */
const W = 288, H = 176, S = 2, cv = $('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false; ctx.setTransform(S, 0, 0, S, 0, 0);
const R = (g, c, x, y, w, h) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
const FLOOR = 43;                              // 벽과 바닥의 경계
const WIN = [[6, 58], [84, 60], [210, 72]];    // 창문 [x, 폭] — 유리는 y 4~34
const MON = [26, 46, 66];                      // 시세 모니터 3대의 x
const SHADOW = 'rgba(120,90,50,.16)';
function frames(g) { // 창틀(구름 위에 다시 그려야 해서 따로 둠)
  const F = '#8d98a8';
  WIN.forEach(([x, w]) => {
    R(g, F, x - 2, 2, w + 4, 2); R(g, F, x - 2, 34, w + 4, 2); R(g, F, x - 2, 4, 2, 30); R(g, F, x + w, 4, 2, 30);
    R(g, F, x, 18, w, 1);
    const n = Math.round(w / 20); for (let i = 1; i < n; i++) R(g, F, x + Math.round(w * i / n) - 1, 4, 2, 30);
    R(g, '#b7c0cc', x - 2, 2, w + 4, .5);
  });
}
function drawRoom(g) {
  let seed = 7; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647; // 매번 같은 도시가 나오게 고정된 난수
  // 창밖: 낮 하늘 + 먼 빌딩 + 가까운 빌딩(벽을 덮기 전에 가로 전체에 그림)
  ['#9ccbef', '#a9d3f2', '#b7daf4', '#c5e2f6', '#d3e9f8', '#e0eff9'].forEach((c, i) => R(g, c, 0, i * 6, W, 6));
  for (let x = 0; x < W;) {
    const w = 8 + Math.floor(rnd() * 10), top = 12 + Math.floor(rnd() * 10);
    R(g, '#b4c6da', x, top, w, 36 - top);
    for (let y = top + 2; y < 34; y += 3) for (let wx = x + 1; wx < x + w - 1; wx += 2) if (rnd() < 0.35) R(g, '#cfdcea', wx, y, 1, 1);
    x += w;
  }
  for (let x = -4; x < W;) {
    const w = 12 + Math.floor(rnd() * 12), top = 19 + Math.floor(rnd() * 10);
    R(g, rnd() < 0.5 ? '#8ea6c2' : '#9bb1ca', x, top, w, 36 - top); R(g, '#c2d3e6', x, top, w, 1);
    for (let y = top + 3; y < 34; y += 4) for (let wx = x + 2; wx < x + w - 2; wx += 3) R(g, rnd() < 0.3 ? '#eef5fb' : '#7890ae', wx, y, 2, 2);
    if (rnd() < 0.3) { R(g, '#8ea6c2', x + (w >> 1), top - 4, 1, 4); R(g, '#e05a4a', x + (w >> 1), top - 5, 1, 1); } // 안테나
    x += w + 1;
  }
  // 벽(창문 자리만 비움) + 걸레받이
  const wall = (x, y, w, h) => R(g, '#ece5d8', x, y, w, h);
  wall(0, 0, W, 4); wall(0, 34, W, 6);
  let px = 0; WIN.forEach(([x, w]) => { wall(px, 4, x - px, 30); px = x + w; }); wall(px, 4, W - px, 30);
  R(g, '#e3dacb', 0, 37, W, 3);
  R(g, '#b7a68b', 0, 40, W, 3); R(g, '#cbbca2', 0, 40, W, 1);
  frames(g);
  WIN.forEach(([x, w]) => R(g, '#dfe3e8', x - 3, 36, w + 6, 2)); // 창턱
  // 벽시계(바늘은 draw에서)
  R(g, '#5a5f6a', 70, 8, 8, 10); R(g, '#5a5f6a', 69, 9, 10, 8); R(g, '#fbfaf6', 71, 9, 6, 8); R(g, '#fbfaf6', 70, 10, 8, 6);
  // 벽걸이 화이트보드(백테스트): 수익 곡선과 막대
  R(g, '#9aa3b0', 152, 5, 50, 30); R(g, '#f7f9fb', 154, 7, 46, 25); R(g, '#7d8796', 154, 32, 46, 2);
  const curve = [27, 26, 27, 24, 25, 22, 23, 20, 21, 18, 17, 15, 16, 13];
  curve.forEach((y, i) => { R(g, '#2f9e6a', 157 + i * 2, y, 2, 1); if (i) R(g, '#2f9e6a', 157 + i * 2, Math.min(y, curve[i - 1]), 1, Math.abs(y - curve[i - 1]) + 1); });
  R(g, '#e05a4a', 188, 21, 2, 8); R(g, '#3f6fd0', 191, 25, 2, 4); R(g, '#e05a4a', 194, 17, 2, 12);
  // 바닥: 따뜻한 베이지 타일 + 창으로 들어오는 햇빛
  R(g, '#e8d8bb', 0, FLOOR, W, H - FLOOR);
  for (let x = 12; x < W; x += 24) R(g, '#ddcaa8', x, FLOOR, .5, H - FLOOR);
  for (let y = FLOOR + 16; y < H; y += 16) R(g, '#ddcaa8', 0, y, W, .5);
  WIN.forEach(([x, w]) => { for (let i = 0; i < 34; i++) { g.fillStyle = 'rgba(255,251,238,' + (0.42 * (1 - i / 34)).toFixed(3) + ')'; g.fillRect(x + i * .5, FLOOR + i, w, 1); } });
  // ── 가구(뒤에서 앞으로) ──
  // 화이트보드 옆 큰 화분
  R(g, SHADOW, 199, 58, 14, 2);
  R(g, '#c98a5a', 201, 50, 10, 8); R(g, '#d9a070', 200, 49, 12, 2);
  [[198, 40, 6, 8], [206, 38, 7, 9], [202, 33, 5, 9], [196, 46, 6, 4], [208, 45, 6, 5]].forEach(b => R(g, '#4f9a4a', ...b));
  [[199, 41], [207, 39], [203, 34]].forEach(([x, y]) => R(g, '#6dbb5c', x, y, 2, 2));
  // 시세 단말기 책상(밝은 회색) + 모니터 3대 + 키보드·마우스·빨간 머그
  R(g, SHADOW, 24, 78, 76, 3);
  R(g, '#d9dbe0', 22, 58, 78, 12); R(g, '#b4b8c0', 22, 70, 78, 8); R(g, '#9ea3ac', 22, 70, 78, 1);
  R(g, '#a6aab3', 80, 71, 18, 7); R(g, '#e8eaee', 86, 73, 6, 1); R(g, '#e8eaee', 86, 76, 6, 1);
  MON.forEach(x => {
    R(g, '#3a3d46', x + 7, 60, 4, 4); R(g, '#3a3d46', x + 5, 63, 8, 1);
    R(g, '#2b2e37', x, 48, 18, 13); R(g, '#13202e', x + 1, 49, 16, 10);
  });
  R(g, '#f2f3f5', 46, 65, 16, 3); R(g, '#c8ccd3', 46, 67, 16, 1); R(g, '#f2f3f5', 66, 65, 3, 3);
  R(g, '#e05a4a', 88, 62, 4, 4); R(g, '#e05a4a', 92, 63, 1, 2);
  R(g, '#ffffff', 24, 62, 10, 6); R(g, '#f4efe0', 25, 63, 10, 6);
  // 남색 사무 의자(책상 왼쪽에 빼 둠)
  R(g, SHADOW, 6, 79, 15, 2);
  R(g, '#3e4b6e', 6, 60, 14, 8); R(g, '#4b5a82', 6, 68, 14, 7); R(g, '#2d3650', 11, 75, 4, 4); R(g, '#20263a', 7, 78, 12, 1);
  // 복합기(낮은 수납장 위) + 스탠드 조명
  R(g, SHADOW, 142, 100, 28, 2);
  R(g, '#cfd3d9', 142, 88, 28, 4); R(g, '#b1b6be', 142, 92, 28, 8); R(g, '#9ea3ac', 155, 94, 2, 4);
  R(g, '#eef0f3', 145, 78, 22, 10); R(g, '#d5d9df', 145, 85, 22, 3); R(g, '#3a3d46', 160, 80, 5, 2); R(g, '#6fcf8f', 163, 80.5, 1, 1);
  R(g, '#ffffff', 148, 76, 12, 3); R(g, '#2a2d36', 147, 86, 18, 1);
  R(g, SHADOW, 6, 104, 10, 2);
  R(g, '#5a5f6a', 10, 90, 2, 14); R(g, '#5a5f6a', 7, 103, 8, 1); R(g, '#f5e6c0', 6, 84, 10, 6); R(g, '#e8d4a4', 6, 88, 10, 2);
  // 서류함 2개(DART): 서랍 3칸, 위에 바인더와 서류
  R(g, SHADOW, 248, 86, 38, 3);
  [248, 268].forEach(x => {
    R(g, '#c3c9d0', x, 46, 18, 4); R(g, '#9ea6b0', x, 50, 18, 36);
    for (let i = 0; i < 3; i++) { R(g, '#8a929d', x, 50 + i * 12, 18, 1); R(g, '#f4efe0', x + 5, 53 + i * 12, 8, 3); R(g, '#e8ebef', x + 6, 58 + i * 12, 6, 1); }
  });
  R(g, '#fbf8ef', 251, 42, 12, 5); R(g, '#e9e2d0', 252, 44, 10, 1);
  [[271, '#3f6fd0'], [275, '#e05a4a'], [279, '#2f9e6a'], [283, '#e0a84a']].forEach(([x, c]) => R(g, c, x, 39, 3, 8));
  // 비서 책상(짙은 회색) + 노트북 + 검은 머그 + 작은 화분·책
  R(g, SHADOW, 188, 96, 58, 3);
  R(g, '#555864', 186, 78, 58, 12); R(g, '#3f414b', 186, 90, 58, 6); R(g, '#33353e', 186, 90, 58, 1);
  R(g, '#c9cfd8', 207, 70, 18, 10); R(g, '#2a3a50', 208, 71, 16, 8); R(g, '#c9cfd8', 205, 80, 22, 4); R(g, '#a9b0ba', 205, 83, 22, 1);
  R(g, '#1a1a1e', 232, 80, 4, 5); R(g, '#1a1a1e', 236, 81, 1, 2);
  R(g, '#c98a5a', 190, 81, 6, 5); [[188, 76, 4, 5], [192, 74, 4, 6], [195, 77, 4, 4]].forEach(b => R(g, '#4f9a4a', ...b));
  R(g, '#3f6fd0', 197, 85, 8, 2); R(g, '#e0a84a', 198, 83, 7, 2);
  // 커피 바(오른쪽 벽): 나무 상판, 커피 머신, 컵 / 아래에 정수기
  R(g, SHADOW, 268, 154, 18, 2);
  R(g, '#c49a6c', 270, 100, 16, 48); R(g, '#a07a52', 270, 148, 16, 6); R(g, '#b08660', 270, 100, 1, 48);
  R(g, '#3a3a42', 272, 104, 12, 12); R(g, '#4a4a54', 272, 104, 12, 3); R(g, '#1c1c22', 275, 109, 6, 5); R(g, '#f4efe6', 276, 111, 4, 3);
  R(g, '#f4efe6', 273, 120, 4, 4); R(g, '#f4efe6', 279, 121, 4, 4); R(g, '#6b3a24', 274, 120, 2, 1);
  R(g, '#e0e6ec', 273, 130, 10, 12); R(g, '#c9d1da', 273, 130, 10, 2); // 쿠키 통
  R(g, SHADOW, 270, 173, 16, 2);
  R(g, '#9fd0f0', 273, 152, 9, 9); R(g, '#5b9bff', 276, 151, 3, 2); R(g, '#eef1f4', 271, 160, 13, 13); R(g, '#d2d8df', 271, 170, 13, 3);
  R(g, '#e05a4a', 274, 164, 2, 2); R(g, '#3f6fd0', 279, 164, 2, 2);
  // 큰 화분(물 주는 자리)
  R(g, SHADOW, 126, 152, 18, 2);

/* ===== 비서 움직임 =====
 * 자리마다 서는 위치. 길은 "가운데 통로(y=108)로 내려가 → 옆으로 → 올라가거나 내려감" 하나라 가구에 걸리지 않음.
 * window는 위쪽 큰 창문 앞에서 도시를 보는 자리 */
const SPOT = {
  home: {x: 208, y: 96, face: 'down'}, dash: {x: 54, y: 78, face: 'up'}, bt: {x: 170, y: 44, face: 'up'},
  fin: {x: 254, y: 88, face: 'up'}, coffee: {x: 254, y: 112, face: 'right'}, plant: {x: 108, y: 130, face: 'right'}, window: {x: 106, y: 46, face: 'up'}};
const AISLE = 108;
const me = {x: 208, y: 96, dir: 'down', path: [], t: 0, frame: 0, done: null, busy: false, work: false};
function walkTo(name) {
  const s = SPOT[name];
  return new Promise(res => {
    const p = [];
    if (Math.abs(me.y - s.y) > 1 || Math.abs(me.x - s.x) > 1) {
      if (Math.abs(me.x - s.x) > 1) { p.push({x: me.x, y: AISLE}, {x: s.x, y: AISLE}); }
      p.push({x: s.x, y: s.y});
    }
    me.path = p; me.face = s.face; me.done = res; me.work = false;
    if (!p.length) { me.dir = s.face; me.done = null; res(); return; }
    // 화면이 멈춰 있으면(다른 앱으로 전환 등) 그림이 안 움직이므로, 오래 걸리면 바로 도착 처리해 일은 계속 진행
    setTimeout(() => { if (me.done === res) { me.x = s.x; me.y = s.y; me.path = []; me.dir = s.face; me.frame = 0; me.done = null; res(); } }, 7000);
  });
}
let bubbleTimer = 0;
function say(text, ms) {
  const b = $('bubble');
  b.textContent = text; b.hidden = false;
  clearTimeout(bubbleTimer);
  if (ms !== 0) bubbleTimer = setTimeout(() => { b.hidden = true; }, ms || 2600);
}
function step(dt) {
  if (me.path.length) {
    const t = me.path[0], dx = t.x - me.x, dy = t.y - me.y, d = Math.hypot(dx, dy), v = 46 * dt;
    if (d <= v) { me.x = t.x; me.y = t.y; me.path.shift(); }
    else { me.x += dx / d * v; me.y += dy / d * v; }
    me.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    me.t += dt; if (me.t > 0.14) { me.t = 0; me.frame = me.frame === 1 ? 2 : 1; }
    if (!me.path.length) { me.dir = me.face || 'down'; me.frame = 0; const f = me.done; me.done = null; if (f) f(); }
  } else if (me.work) { me.t += dt; if (me.t > 0.25) { me.t = 0; me.frame = me.frame ? 0 : 1; } } // 일하는 중: 제자리에서 살짝 움직임
  else me.frame = 0;
}
function draw(now) {
  ctx.drawImage(bg, 0, 0, W, H);
  // 창밖 구름이 천천히 흘러감(유리 안에서만 보이게 잘라 그린 뒤 창틀을 다시 덮음)
  ctx.save(); ctx.beginPath(); WIN.forEach(([x, w]) => ctx.rect(x, 4, w, 30)); ctx.clip();
  CLOUDS.forEach(([o, y, w, v]) => {
    const x = Math.round(((now / 1000 * v + o) % (W + 40) - 30) * 2) / 2;
    R(ctx, '#ffffff', x, y, w, 2); R(ctx, '#ffffff', x + w * .25, y - 1.5, w * .5, 1.5); R(ctx, '#e4f1fb', x, y + 2, w, .5);
  });
  ctx.restore(); frames(ctx);
  // 모니터 3대: 봉 차트 / 선 차트 / 봉 차트가 흘러감
  const k = Math.floor(now / 400);
  MON.forEach((mx, m) => {
    for (let i = 0; i < 30; i++) {
      const t = i / 2 + k + m * 5, a = (Math.sin(t * .9) + Math.sin(t * .37) + 2) * 1.6, y = 50 + Math.round(a * 2) / 2;
      if (m === 1) R(ctx, '#6fcf8f', mx + 1.5 + i / 2, y, .5, .5);
      else if (i % 2 === 0) R(ctx, Math.sin(t * 1.3) > 0 ? '#ff6b5e' : '#5b9bff', mx + 1.5 + i / 2, y, .5, 2);
    }
  });
  // 벽시계 바늘(지금 시각)
  const d = new Date(), hand = (ang, len, c) => { for (let r = .5; r <= len; r += .5) R(ctx, c, Math.round((74 + Math.sin(ang) * r) * 2) / 2 - .25, Math.round((13 - Math.cos(ang) * r) * 2) / 2 - .25, .5, .5); };
  hand((d.getHours() % 12 + d.getMinutes() / 60) / 6 * Math.PI, 2, '#2a2d36'); hand(d.getMinutes() / 30 * Math.PI, 3, '#2a2d36');
  const up = imgHead ? (PH - SH) / S : 0; // 그림 머리를 쓰면 키가 커져서 위로 더 올라감(발 위치는 같음)
  if (me.work && k % 2) R(ctx, '#f3a83a', me.x + 5, me.y - 6 - up, 2, 2); // 일하는 표시
  ctx.drawImage(SPR[me.dir][me.frame === 2 ? 2 : me.frame], Math.round(me.x * S) / S - 1 - (imgHead ? 2 : 0), Math.round(me.y * S) / S - 2 - up,
    (imgHead ? PW : SW) / S, (imgHead ? PH : SH) / S);
  const b = $('bubble'); // 말풍선은 비서 머리 위
  b.style.left = ((me.x + 6) / W * 100) + '%'; b.style.top = ((me.y - 5 - up) / H * 100) + '%';
}

/* ===== 재무(DART) =====
 * 분기 손익: 1·2·3분기 보고서는 그 분기 3개월 값, 사업보고서(4분기)는 1년 값 − 3분기 누적 */
function quarterly(periods, f) {
  const by = {}; periods.forEach(p => { by[p.y * 10 + p.q] = p; });
  return p => {
    const v = p[f] || (f === 'nio' ? p.ni : null); if (!v || v.a == null) return null;
    if (p.q !== 4) return v.a;
    const p3 = by[p.y * 10 + 3], v3 = p3 && (p3[f] || (f === 'nio' ? p3.ni : null));
    return v3 && v3.c != null ? v.a - v3.c : null;
  };
}
/* PBR 밴드: 분기마다의 BPS(분기 말 기준, 다음 분기 말까지 그대로) × 1·2·3·4배 선과 실제 종가를 함께 그림.
 * 가이드라인 = 지금 BPS × 배수, 그리고 지난 기간 실제 PBR의 최저·평균·최고를 지금 BPS에 곱한 값 */
const BAND = [[1, '#7f8fb3'], [2, '#6fcf8f'], [3, '#c9a45c'], [4, '#e88a5a']];
function bandCard(P, bars, bps, price) {
  const QE = ['0331', '0630', '0930', '1231'];
  const bp = P.map(p => { const eq = p.eqo != null ? p.eqo : p.eq, sh = p.shares ? p.shares - (p.treasury || 0) : null; return {d: p.y + QE[p.q - 1], b: eq && sh ? eq / sh : null}; })
    .filter(x => x.b > 0).sort((a, b) => a.d < b.d ? -1 : 1);
  let chart = '', st = null;
  if (bp.length >= 2 && bars && bars.length > 20) {
    let k = 0;
    const pts = bars.filter(r => r[0] >= bp[0].d && r[4] > 0).map(r => { while (k + 1 < bp.length && bp[k + 1].d <= r[0]) k++; return {d: r[0], c: r[4], b: bp[k].b}; });
    if (pts.length > 20) {
      const pb = pts.map(x => x.c / x.b);
      st = {min: Math.min(...pb), max: Math.max(...pb), avg: pb.reduce((a, b) => a + b, 0) / pb.length, from: pts[0].d};
      const cw = 320, chh = 190, L = 38, Rr = 30, T = 8, B = 20, n = pts.length;
      const hi = Math.max(...pts.map(x => Math.max(x.c, x.b * 4))) * 1.04;
      const X = i => L + (cw - L - Rr) * i / (n - 1), Y = v => T + (chh - T - B) * (1 - v / hi);
      const path = f => pts.map((x, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(f(x)).toFixed(1)).join('');
      const fmt = v => v >= 1e4 ? Math.round(v / 1e4).toLocaleString('ko-KR') + '만' : Math.round(v).toLocaleString('ko-KR');
      let g = '';
      for (let i = 1; i <= 4; i++) { const v = hi / 4 * i; g += '<line x1="' + L + '" x2="' + (cw - Rr) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="#2c2840"/><text x="' + (L - 4) + '" y="' + (Y(v) + 3).toFixed(1) + '" text-anchor="end">' + fmt(v) + '</text>'; }
      let py = '';
      pts.forEach((x, i) => { const y = x.d.slice(0, 4); if (py && y !== py) g += '<line x1="' + X(i).toFixed(1) + '" x2="' + X(i).toFixed(1) + '" y1="' + T + '" y2="' + (chh - B) + '" stroke="#2c2840"/><text x="' + X(i).toFixed(1) + '" y="' + (chh - 6) + '" text-anchor="middle">' + y + '</text>'; py = y; });
      BAND.forEach(([m, col]) => { g += '<path d="' + path(x => x.b * m) + '" fill="none" stroke="' + col + '" stroke-width="1.2" stroke-dasharray="4 3"/><text x="' + (cw - Rr + 3) + '" y="' + (Y(pts[n - 1].b * m) + 3).toFixed(1) + '" style="fill:' + col + '">' + m + '배</text>'; });
      g += '<path d="' + path(x => x.c) + '" fill="none" stroke="#ece6d6" stroke-width="1.6" stroke-linejoin="round"/>';
      chart = '<svg class="ch" viewBox="0 0 ' + cw + ' ' + chh + '" role="img" aria-label="PBR 밴드 차트">' + g + '</svg>';
    }
  }
  const diff = v => price ? ' <span class="' + (v >= price ? 'up' : 'dn') + '">(' + (v >= price ? '+' : '') + ((v / price - 1) * 100).toFixed(0) + '%)</span>' : '';
  const row = (l, v, now) => '<div class="' + (now ? 'now' : '') + '"><span>' + l + '</span><span>' + won(v) + '원' + diff(v) + '</span></div>';
  const pbr = price ? price / bps : null;
  let h = '<div><div class="note" style="margin-bottom:4px">PBR 밴드' + (st ? ' (' + st.from.slice(2, 4) + '.' + st.from.slice(4, 6) + '부터, 흰 선 = 종가)' : '') + '</div>' + (chart || '<p class="note">주가나 분기 BPS가 모자라 밴드 그래프는 생략했어요.</p>') + '</div>';
  h += '<div><div class="note" style="margin-bottom:4px">목표 가이드라인 (지금 BPS ' + won(bps) + '원 기준, 괄호는 현재가 대비)</div><div class="mults">';
  BAND.forEach(([m]) => { h += row('PBR ' + m + '배', bps * m, pbr && Math.abs(pbr - m) < 0.5); });
  if (st) h += row('지난 기간 최저 ' + st.min.toFixed(2) + '배', bps * st.min) + row('지난 기간 평균 ' + st.avg.toFixed(2) + '배', bps * st.avg) + row('지난 기간 최고 ' + st.max.toFixed(2) + '배', bps * st.max);
  h += '</div></div>';
  return h;
}
function finCard(stock, j, px, bars) {
  const P = j.periods; if (!P.length) return '<h2>' + esc(stock[1]) + '</h2><p class="note">DART에 분기 재무가 없어요(최근 상장, 금융업 등 형식이 다른 회사일 수 있어요).</p>';
  const p0 = P[0], lab = p => (p.y % 100) + '년 ' + p.q + '분기';
  const eq = p0.eqo != null ? p0.eqo : p0.eq, sh = p0.shares ? p0.shares - (p0.treasury || 0) : null;
  const bps = eq && sh ? eq / sh : null, price = px && px.c, pbr = bps && price ? price / bps : null;
  const qn = quarterly(P, 'nio'), last4 = P.slice(0, 4).map(qn), ttm = last4.length === 4 && last4.every(x => x != null) ? last4.reduce((a, b) => a + b, 0) : null;
  const p4 = P[4], eq4 = p4 ? (p4.eqo != null ? p4.eqo : p4.eq) : null, roe = ttm != null && eq ? ttm / (eq4 ? (eq + eq4) / 2 : eq) : null;
  const per = ttm > 0 && price && sh ? price * sh / ttm : null;
  const kv = (l, v) => '<div><span>' + l + '</span><b>' + v + '</b></div>';
  let h = '<h2>' + esc(stock[1]) + ' <span class="sub">' + stock[0] + ' · ' + lab(p0) + ' 기준 · ' + (p0.fs === 'CFS' ? '연결' : '별도') + '</span></h2><div class="kv">' +
    kv('주가' + (px ? ' (' + px.d.slice(4, 6) + '.' + px.d.slice(6) + ')' : ''), price ? won(price) + '원' : '–') + kv('BPS', bps ? won(bps) + '원' : '–') + kv('PBR', pbr ? pbr.toFixed(2) + '배' : '–') +
    kv('ROE (최근 4분기)', pct(roe)) + kv('PER (최근 4분기)', per ? per.toFixed(1) + '배' : '–') + kv('지배주주 자본', big(eq)) +
    kv('현금성자산', big(p0.cash)) + kv('부채비율', p0.liab != null && p0.eq ? pct(p0.liab / p0.eq) : '–') + kv('주식 수 (자사주 뺌)', sh ? (sh / 1e8).toFixed(2) + '억주' : '–') + '</div>';
  // 분기 매출·영업이익 막대(오래된 → 최근)
  const qr = quarterly(P, 'rev'), qo = quarterly(P, 'op'), Q = P.slice(0, 8).reverse().map(p => ({l: (p.y % 100) + '.' + p.q + 'Q', r: qr(p), o: qo(p)}));
  const mx = Math.max(1, ...Q.map(x => Math.max(x.r || 0, Math.abs(x.o || 0))));
  const cw = 300, ch = 120, bw = cw / Q.length, Y = v => 100 - (v / mx) * 88;
  let g = '';
  Q.forEach((x, i) => {
    const x0 = i * bw + bw * 0.18, w = bw * 0.3;
    if (x.r != null) g += '<rect x="' + x0.toFixed(1) + '" y="' + Y(Math.max(0, x.r)).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + (100 - Y(Math.max(0, x.r))).toFixed(1) + '" fill="#8a84a6"/>';
    if (x.o != null) { const top = Y(Math.max(0, x.o)), hh = Math.abs(Y(x.o) - 100); g += '<rect x="' + (x0 + w + 1).toFixed(1) + '" y="' + (x.o >= 0 ? top : 100).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(1, hh).toFixed(1) + '" fill="' + (x.o >= 0 ? '#c9a45c' : '#5b9bff') + '"/>'; }
    g += '<text x="' + (i * bw + bw / 2).toFixed(1) + '" y="114" text-anchor="middle">' + x.l + '</text>';
  });
  h += '<div><div class="note">분기 매출(회색)·영업이익(황동) · 최근 ' + big(Q[Q.length - 1].r) + ' / ' + big(Q[Q.length - 1].o) + '</div><svg class="ch" viewBox="0 0 ' + cw + ' ' + ch + '" role="img" aria-label="분기 매출과 영업이익"><line x1="0" x2="' + cw + '" y1="100" y2="100" stroke="#3a3452"/>' + g + '</svg></div>';
  if (bps) h += bandCard(P, bars, bps, price);
  h += '<p class="note">DART 정기보고서(분기·반기·사업) 기준. BPS = 지배주주 자본 ÷ (발행주식 − 자기주식). 배수별 주가는 "그 배수라면"이라는 계산이고 예측이 아니에요.</p>';
  return h;
}
async function doFin(q) {
  let stock = null;
  try { stock = await findStock(q); } catch (e) { say(e.message, 4000); showCard('<p class="err">' + esc(e.message) + '</p><a class="btn" href="../backtest/">백테스트 페이지로</a>'); return; }
  if (!stock) { say('"' + q + '" 종목을 못 찾았어요', 3000); return; }
  me.busy = true; $('send').disabled = true;
  say(stock[1] + ' 서류 찾으러 갈게요', 0);
  await walkTo('fin');
  me.work = true; say('DART에서 ' + stock[1] + ' 재무 찾는 중…', 0);
  try {
    // 재무 3년(12분기) + 일봉 약 3년(밴드 그래프용)
    const [j, c] = await Promise.all([api('dart=' + stock[0] + '&q=12'), api('candles=' + stock[0] + ':' + stock[2] + '&n=780').catch(() => null)]);
    if (!Array.isArray(j.periods)) throw new Error('Apps Script가 예전 버전이라 재무(DART)를 모릅니다. 저장소의 backtest/apps_script.gs.txt를 붙여넣고 "배포 관리 → 새 버전"으로 배포해 주세요.');
    const bars = c && c.data && c.data[stock[0]], b = bars && bars[bars.length - 1], px = b ? {d: b[0], c: b[4]} : null;
    me.work = false; say('찾았어요! 정리해서 드릴게요', 0);
    await walkTo('home');
    showCard(finCard(stock, j, px, bars));
    say(stock[1] + ' 재무 정리 끝 ✔', 3000);
    log(stock[1] + ' 재무 조회 (' + (j.periods[0] ? (j.periods[0].y % 100) + '년 ' + j.periods[0].q + '분기' : '자료 없음') + ')');
    $('result').scrollIntoView({behavior: 'smooth', block: 'nearest'});
  } catch (e) {
    me.work = false; say('앗, 실패했어요', 3000);
    showCard('<h2>' + esc(stock[1]) + '</h2><p class="err">' + esc(e.message) + '</p>' + (/DART_API_KEY|dart/i.test(e.message) || /응답을 읽지/.test(e.message) ? '<p class="note">Apps Script를 새 버전으로 배포했는지, 스크립트 속성에 DART_API_KEY가 있는지 확인해 주세요.</p>' : ''));
    log(stock[1] + ' 재무 조회 실패: ' + e.message);
    $('result').scrollIntoView({behavior: 'smooth', block: 'nearest'});
    walkTo('home');
  } finally { me.busy = false; $('send').disabled = false; }
}
async function goPlace(spot, msg, href, label) {
  me.busy = true;
  say(msg, 0); await walkTo(spot);
  me.work = true; say(label + ' 준비됐어요', 0);
  showCard('<h2>' + label + '</h2><p class="sub">' + esc(msg) + '</p><div><a class="btn" href="' + href + '">' + label + ' 열기 →</a></div>');
  log(label + ' 열기');
  setTimeout(() => { me.work = false; me.busy = false; $('bubble').hidden = true; }, 2500);
}

/* ===== 명령 ===== */
async function command(t) {
  t = (t || '').trim(); if (!t || me.busy) return;
  if (/백테스트|전략|이동평균|이평|RSI|MACD|볼린저|신고가|변동성|수급/i.test(t)) return goPlace('bt', '화이트보드에서 전략을 시험해요', '../backtest/', '백테스트');
  if (/대시보드|보유|포트폴리오|자산|내\s*주식|손익/.test(t)) return goPlace('dash', '시세 단말기에서 보유 현황을 봐요', '../', '대시보드');
  const q = t.replace(/재무제표|재무|BPS|PBR|PER|ROE|밴드|목표|가이드\s*라인|가이드|실적|분석|평가|가져\s*와|보여\s*줘|알려\s*줘|찾아\s*줘|해\s*줘|줘|좀|의|\?/gi, ' ').trim();
  if (q) return doFin(q);
  say('예: "삼성전자 재무", "백테스트", "대시보드"', 3000);
}
$('cmdForm').onsubmit = e => { e.preventDefault(); const v = $('cmd').value; $('cmd').value = ''; $('cmd').blur(); command(v); };
$('chips').onclick = e => { const b = e.target.closest('[data-q]'); if (b) command(b.dataset.q); };
document.querySelectorAll('.spot').forEach(b => { b.onclick = () => {
  if (b.dataset.act === 'fin') { $('cmd').focus(); say('어느 종목의 재무를 볼까요?', 3000); walkTo('fin'); }
  else command(b.dataset.act === 'bt' ? '백테스트' : '대시보드');
}; });
setTimeout(() => say(getSync() ? '안녕하세요! 무엇을 도와드릴까요?' : '백테스트 페이지에서 Apps Script를 먼저 연결해 주세요', 3500), 600);
</script>
