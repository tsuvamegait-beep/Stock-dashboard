<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073d59">
<title>예찌 & 한원의 트래블로그</title>
<style>
:root{--navy:#073d59;--night:#04293d;--cream:#fffaf0;--gold:#ffd27a;--aqua:#69e2dc;--glass:rgb(3 38 56/.72);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--cream)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 76% 0,#176785 0,var(--night) 56%);display:grid;place-items:start center;padding:18px}button,a{font:inherit}main{width:min(1080px,100%)}
.top{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 4px 12px}.eyebrow{margin:0;color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.12em}.top h1{margin:2px 0 0;font-size:clamp(22px,4vw,38px);letter-spacing:-.04em}.back{color:var(--cream);text-decoration:none;border:1px solid rgb(255 255 255/.24);background:rgb(255 255 255/.08);padding:9px 13px;border-radius:999px;white-space:nowrap}
.destinations{display:flex;gap:8px;margin:0 4px 12px;overflow:auto;padding-bottom:2px}.tab{display:flex;align-items:center;gap:7px;color:#cce8f2;text-decoration:none;border:1px solid rgb(255 255 255/.16);background:rgb(255 255 255/.07);padding:9px 14px;border-radius:999px;font-weight:800;font-size:13px;white-space:nowrap}.tab[aria-selected="true"]{color:#073448;background:var(--aqua);border-color:var(--aqua);box-shadow:0 8px 24px rgb(40 217 210/.24)}
.panel[hidden]{display:none}.scene{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgb(0 0 0/.42),inset 0 0 0 1px rgb(255 255 255/.18);isolation:isolate;background-position:center;background-size:cover;background-repeat:no-repeat}.scene::after{content:"";position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(transparent,rgb(2 16 28/.24));pointer-events:none;z-index:1}.shanghai{background-image:url('assets/oriental-pearl-promenade-v1.png')}.miyako{background-image:url('assets/miyakojima-beach-v1.png')}
.caption{position:absolute;z-index:6;left:3%;top:4%;max-width:52%;padding:11px 14px;border:1px solid rgb(255 255 255/.25);border-radius:15px;background:var(--glass);backdrop-filter:blur(10px);box-shadow:0 8px 24px rgb(0 0 0/.2)}.caption b{display:block;font-size:clamp(14px,2vw,20px)}.caption span{display:block;margin-top:2px;font-size:clamp(10px,1.3vw,13px);color:#e2f7ff}.weather{position:absolute;z-index:6;right:3%;top:4%;padding:8px 11px;border-radius:999px;background:rgb(255 255 255/.85);color:#07516c;font-size:12px;font-weight:900;box-shadow:0 6px 20px rgb(0 77 105/.18)}
.yejji-shanghai{position:absolute;z-index:3;left:18%;bottom:2.5%;width:clamp(100px,17vw,184px);aspect-ratio:1;background-image:url('assets/yejji-winter-ivory-tourist-v2.png');background-repeat:no-repeat;background-size:200% 200%;background-position:0 0;filter:drop-shadow(0 8px 5px rgb(0 0 0/.3));transform:translateX(-50%);transition:left 4.8s linear;will-change:left}.yejji-shanghai[data-outfit="classic"]{background-image:url('assets/yejji-shanghai-tourist-v1.png')}.yejji-shanghai.right{background-position:0 0}.yejji-shanghai.left{background-position:100% 0}.yejji-shanghai.photo{background-position:0 100%}.yejji-shanghai.wave{background-position:100% 100%}
.traveler{position:absolute;z-index:4;width:clamp(108px,17vw,190px);aspect-ratio:1;background-repeat:no-repeat;background-size:200% 200%;transform:translateX(-50%);filter:drop-shadow(0 7px 4px rgb(0 58 76/.28));transition:left 6.8s ease-in-out,bottom 1s ease,scale .8s ease;will-change:left,bottom,scale}.traveler.yejji{background-image:url('assets/yejji-snorkel-v2.png');left:25%;bottom:-1%}.traveler.hanwon{background-image:url('assets/hanwon-snorkel-v1.png');left:40%;bottom:-2%;width:clamp(102px,16vw,180px)}.traveler.walk-right{background-position:0 0}.traveler.walk-left{background-position:100% 0}.traveler.swim{background-position:0 100%;scale:.78;animation:float 1.9s ease-in-out infinite}.traveler.wave{background-position:100% 100%}.traveler.bob{animation:bob .52s steps(2) infinite}
.water-surface{position:absolute;z-index:5;left:-3%;right:-3%;top:55%;height:25%;opacity:0;pointer-events:none;background:linear-gradient(180deg,rgb(130 245 235/.08),rgb(15 160 190/.32)),repeating-radial-gradient(ellipse at 48% 0,transparent 0 24px,rgb(235 255 255/.42) 26px 28px,transparent 30px 52px);mask-image:linear-gradient(transparent,#000 20%,#000 82%,transparent);transform:skewY(-1deg);transition:opacity .6s ease}.miyako.snorkeling .water-surface{opacity:1;animation:waterShimmer 3.4s ease-in-out infinite alternate}
.bubble{position:absolute;z-index:3;bottom:35%;width:8px;aspect-ratio:1;border:2px solid rgb(229 255 255/.9);border-radius:50%;opacity:0}.miyako.snorkeling .bubble{animation:bubbles 3.2s ease-in infinite}.bubble.b1{left:34%;animation-delay:.2s!important}.bubble.b2{left:53%;width:11px;animation-delay:1.1s!important}.bubble.b3{left:66%;width:6px;animation-delay:2s!important}
@keyframes bob{50%{translate:0 -3px}}@keyframes float{50%{translate:0 -3px;rotate:-1deg}}@keyframes waterShimmer{50%{translate:1.5% 2px;opacity:.8}}@keyframes bubbles{0%{opacity:0;translate:0 0}20%{opacity:.9}100%{opacity:0;translate:12px -90px}}
.flash{position:absolute;z-index:7;width:22px;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 32px 16px #fff8b4;opacity:0;pointer-events:none}.flash.on{animation:flash .65s ease-out}@keyframes flash{0%,15%{opacity:1;scale:.3}100%{opacity:0;scale:3}}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:14px}.controls button{border:1px solid rgb(255 255 255/.18);border-radius:999px;padding:10px 16px;background:rgb(255 255 255/.1);color:var(--cream);font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgb(0 0 0/.15)}.controls button:hover,.controls button:focus-visible{background:var(--gold);color:#33210a;outline:none}.status{text-align:center;min-height:24px;margin:9px 0 0;color:#c7e7f1;font-size:13px}
@media(max-width:560px){body{padding:10px}.top{align-items:center}.back{font-size:12px;padding:7px 10px}.destinations{margin-bottom:9px}.tab{font-size:12px;padding:8px 11px}.scene{border-radius:17px;aspect-ratio:4/3}.caption{max-width:70%}.weather{font-size:10px;padding:6px 8px}.yejji-shanghai{width:clamp(86px,28vw,126px);bottom:0}.traveler{width:clamp(96px,28vw,132px)}.traveler.hanwon{width:clamp(91px,26vw,124px)}.traveler.swim{scale:.74}.water-surface{top:54%;height:27%}.controls{gap:7px}.controls button{font-size:12px;padding:9px 12px}}
@media(prefers-reduced-motion:reduce){.yejji-shanghai,.traveler{transition:none}.bob,.traveler.swim,.miyako.snorkeling .bubble,.miyako.snorkeling .water-surface{animation:none!important}}
</style>
<body>
<main>
  <header class="top"><div><p class="eyebrow">YEJJI & HANWON'S TRAVEL LOG</p><h1 id="page-title">동방명주에서, 예찌</h1></div><a class="back" href="../office/">← Office</a></header>
  <nav class="destinations" role="tablist" aria-label="여행지 선택">
    <a class="tab" id="tab-shanghai" role="tab" aria-controls="panel-shanghai" aria-selected="true" href="#shanghai">🌃 상하이</a>
    <a class="tab" id="tab-miyakojima" role="tab" aria-controls="panel-miyakojima" aria-selected="false" href="#miyakojima">🐠 미야코지마</a>
  </nav>
  <section class="panel" id="panel-shanghai" role="tabpanel" aria-labelledby="tab-shanghai">
    <div class="scene shanghai" id="shanghai-scene" aria-label="동방명주와 황푸강 야경을 배경으로 예찌가 관광하는 2D 화면"><div class="caption"><b>Shanghai · The Bund</b><span>황푸강 너머 반짝이는 동방명주를 바라보는 저녁</span></div><div class="yejji-shanghai right bob" id="shanghai-yejji" data-outfit="winter" role="img" aria-label="아이보리 코트를 입고 상하이를 관광하는 예찌"></div><div class="flash" id="flash"></div></div>
    <nav class="controls" aria-label="상하이 관광 동작"><button type="button" data-shanghai="walk">🚶 산책하기</button><button type="button" data-shanghai="pose">📷 여행 포즈</button><button type="button" data-shanghai="wave">👋 손 흔들기</button><button type="button" data-shanghai="outfit">🧥 코디 바꾸기</button></nav><p class="status" id="shanghai-status" aria-live="polite">예찌가 와이탄 산책로를 걷고 있어요.</p>
  </section>
  <section class="panel" id="panel-miyakojima" role="tabpanel" aria-labelledby="tab-miyakojima" hidden>
    <div class="scene miyako" id="miyako-scene" aria-label="미야코지마의 투명한 바다에서 예찌와 한원이 스노클링하는 2D 화면"><div class="caption"><b>Miyakojima · Okinawa</b><span>산호빛 얕은 바다를 함께 헤엄치고 걷는 여름날</span></div><div class="weather">☀ 28°C · 물빛 최고</div><div class="traveler yejji walk-right bob" id="miyako-yejji" role="img" aria-label="중간 길이 웨이브 머리와 코랄 래시가드로 스노클링을 즐기는 예찌"></div><div class="traveler hanwon walk-right bob" id="miyako-hanwon" role="img" aria-label="네이비 래시가드를 입고 스노클링을 즐기는 한원"></div><div class="water-surface" aria-hidden="true"></div><i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i></div>
    <nav class="controls" aria-label="미야코지마 여행 동작"><button type="button" data-miyako="walk">🏝️ 해변 산책</button><button type="button" data-miyako="snorkel">🤿 같이 스노클링</button><button type="button" data-miyako="wave">👋 바다에서 인사</button></nav><p class="status" id="miyako-status" aria-live="polite">예찌와 한원이 미야코지마 해변을 천천히 걷고 있어요.</p>
  </section>
</main>
<script>
const destinations={shanghai:{title:'동방명주에서, 예찌'},miyakojima:{title:'미야코지마에서, 예찌 & 한원'}};
function selectDestination(name){if(!destinations[name])name='shanghai';Object.keys(destinations).forEach(key=>{const active=key===name;document.getElementById('tab-'+key).setAttribute('aria-selected',String(active));document.getElementById('panel-'+key).hidden=!active});document.getElementById('page-title').textContent=destinations[name].title;document.title=destinations[name].title+' · Travel Log'}
addEventListener('hashchange',()=>selectDestination(location.hash.slice(1)));selectDestination(location.hash.slice(1));
const sy=document.getElementById('shanghai-yejji'),ss=document.getElementById('shanghai-status'),flash=document.getElementById('flash');let stimer=0,sright=false,outfit='winter';
function shanghaiPose(name,text){clearTimeout(stimer);sy.className='yejji-shanghai '+name;ss.textContent=text}
function shanghaiWalk(){clearTimeout(stimer);sright=!sright;sy.className='yejji-shanghai '+(sright?'right':'left')+' bob';sy.style.left=sright?'76%':'18%';ss.textContent='예찌가 황푸강 바람을 맞으며 산책하고 있어요.';stimer=setTimeout(shanghaiWalk,5000)}
function travelPose(){shanghaiPose('photo',outfit==='winter'?'예찌가 아이보리 코트 주머니에 손을 넣고 동방명주 야경을 바라봐요.':'찰칵! 동방명주 야경을 여행 사진으로 남겼어요.');if(outfit==='classic'){const r=sy.getBoundingClientRect(),s=document.getElementById('shanghai-scene').getBoundingClientRect();flash.style.left=(r.left-s.left+r.width*.54)+'px';flash.style.top=(r.top-s.top+r.height*.37)+'px';flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on')}}
function changeOutfit(){outfit=outfit==='winter'?'classic':'winter';sy.dataset.outfit=outfit;shanghaiPose('wave',outfit==='winter'?'아이보리 코트와 퍼 모자 코디로 갈아입었어요.':'차콜 롱코트 여행 코디로 갈아입었어요.')}
document.querySelector('[aria-label="상하이 관광 동작"]').addEventListener('click',e=>{const a=e.target.dataset.shanghai;if(a==='walk')shanghaiWalk();if(a==='pose')travelPose();if(a==='wave')shanghaiPose('wave','예찌가 동방명주를 배경으로 반갑게 손을 흔들어요.');if(a==='outfit')changeOutfit()});
const my=document.getElementById('miyako-yejji'),mh=document.getElementById('miyako-hanwon'),ms=document.getElementById('miyako-status'),mScene=document.getElementById('miyako-scene');let mtimer=0,mright=false;
function setTravelers(yClass,hClass){my.className='traveler yejji '+yClass;mh.className='traveler hanwon '+hClass}
function miyakoWalk(){clearTimeout(mtimer);mScene.classList.remove('snorkeling');mright=!mright;setTravelers((mright?'walk-right':'walk-left')+' bob',(mright?'walk-right':'walk-left')+' bob');my.style.left=mright?'72%':'22%';mh.style.left=mright?'86%':'36%';my.style.bottom='-1%';mh.style.bottom='-2%';ms.textContent='예찌와 한원이 에메랄드빛 물가를 나란히 산책해요.';mtimer=setTimeout(miyakoWalk,7200)}
function snorkel(){clearTimeout(mtimer);mScene.classList.add('snorkeling');setTravelers('swim','swim');my.style.left='41%';mh.style.left='63%';my.style.bottom='26%';mh.style.bottom='23%';ms.textContent='첨벙! 두 사람이 몸을 물속에 담그고 맑은 산호 바다를 함께 탐험해요.'}
function miyakoWave(){clearTimeout(mtimer);mScene.classList.remove('snorkeling');setTravelers('wave','wave');my.style.left='40%';mh.style.left='61%';my.style.bottom='-1%';mh.style.bottom='-2%';ms.textContent='예찌와 한원이 미야코지마 바다에서 반갑게 손을 흔들어요.'}
document.querySelector('[aria-label="미야코지마 여행 동작"]').addEventListener('click',e=>{const a=e.target.dataset.miyako;if(a==='walk')miyakoWalk();if(a==='snorkel')snorkel();if(a==='wave')miyakoWave()});
if(matchMedia('(prefers-reduced-motion: reduce)').matches){shanghaiPose('wave','예찌가 동방명주 야경을 감상하고 있어요.');miyakoWave()}else{stimer=setTimeout(shanghaiWalk,1200);mtimer=setTimeout(miyakoWalk,1600)}
</script>
</html>
