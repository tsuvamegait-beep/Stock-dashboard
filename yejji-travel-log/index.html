<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073d59">
<title>예찌 & 한원의 트래블로그</title>
<style>
:root{--navy:#073d59;--night:#04293d;--cream:#fffaf0;--gold:#ffd27a;--aqua:#69e2dc;--glass:rgb(3 38 56/.72);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--cream)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 76% 0,#176785 0,var(--night) 56%);display:grid;place-items:start center;padding:18px}button,a{font:inherit}main{width:min(1080px,100%);min-width:0}
.top{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 4px 12px}.eyebrow{margin:0;color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.12em}.top h1{margin:2px 0 0;font-size:clamp(22px,4vw,38px);letter-spacing:-.04em}.back{color:var(--cream);text-decoration:none;border:1px solid rgb(255 255 255/.24);background:rgb(255 255 255/.08);padding:9px 13px;border-radius:999px;white-space:nowrap}
.destinations{display:flex;gap:8px;margin:0 4px 12px;overflow:auto;padding-bottom:2px;scrollbar-width:none}.destinations::-webkit-scrollbar{display:none}.tab{display:flex;align-items:center;gap:7px;color:#cce8f2;text-decoration:none;border:1px solid rgb(255 255 255/.16);background:rgb(255 255 255/.07);padding:9px 14px;border-radius:999px;font-weight:800;font-size:13px;white-space:nowrap}.tab[aria-selected="true"]{color:#073448;background:var(--aqua);border-color:var(--aqua);box-shadow:0 8px 24px rgb(40 217 210/.24)}
.spot-tabs{display:flex;justify-content:center;gap:7px;margin:0 4px 10px;overflow:auto;padding:2px;scrollbar-width:none}.spot-tabs::-webkit-scrollbar{display:none}.spot-tabs button{border:1px solid rgb(255 255 255/.16);border-radius:999px;padding:8px 13px;background:rgb(255 255 255/.07);color:#cce8f2;font-weight:800;font-size:12px;white-space:nowrap;cursor:pointer}.spot-tabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#3b270c;box-shadow:0 7px 20px rgb(255 190 80/.2)}
.panel[hidden]{display:none}.scene{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgb(0 0 0/.42),inset 0 0 0 1px rgb(255 255 255/.18);isolation:isolate;background-position:center;background-size:cover;background-repeat:no-repeat}.scene::after{content:"";position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(transparent,rgb(2 16 28/.24));pointer-events:none;z-index:1}.shanghai{background-image:url('assets/oriental-pearl-promenade-v1.png')}.miyako{background-image:url('assets/miyakojima-beach-v1.png');transition:background-image .35s ease}.miyako.burger-zone{background-image:url('assets/miyakojima-burger-zone-v1.png')}.miyako.runway-zone{background-image:url('assets/miyakojima-runway-sunset-v1.png')}.miyako.performance-zone{background-image:url('assets/miyakojima-island-performance-v1.png')}.miyako.turtle-zone{background-image:url('assets/miyakojima-blue-turtle-cafe-v1.png')}
.caption{position:absolute;z-index:6;left:3%;top:4%;max-width:52%;padding:11px 14px;border:1px solid rgb(255 255 255/.25);border-radius:15px;background:var(--glass);backdrop-filter:blur(10px);box-shadow:0 8px 24px rgb(0 0 0/.2)}.caption b{display:block;font-size:clamp(14px,2vw,20px);overflow-wrap:anywhere}.caption span{display:block;margin-top:2px;font-size:clamp(10px,1.3vw,13px);color:#e2f7ff}.weather{position:absolute;z-index:6;right:3%;top:4%;padding:8px 11px;border-radius:999px;background:rgb(255 255 255/.85);color:#07516c;font-size:12px;font-weight:900;box-shadow:0 6px 20px rgb(0 77 105/.18)}
.yejji-shanghai{position:absolute;z-index:3;left:18%;bottom:2.5%;width:clamp(100px,17vw,184px);aspect-ratio:1;background-image:url('assets/yejji-winter-ivory-tourist-v2.png');background-repeat:no-repeat;background-size:200% 200%;background-position:0 0;filter:drop-shadow(0 8px 5px rgb(0 0 0/.3));transform:translateX(-50%);transition:left 4.8s linear;will-change:left}.yejji-shanghai[data-outfit="classic"]{background-image:url('assets/yejji-shanghai-tourist-v1.png')}.yejji-shanghai.right{background-position:0 0}.yejji-shanghai.left{background-position:100% 0}.yejji-shanghai.photo{background-position:0 100%}.yejji-shanghai.wave{background-position:100% 100%}
.traveler{position:absolute;z-index:4;width:clamp(108px,17vw,190px);aspect-ratio:1;background-repeat:no-repeat;background-size:200% 200%;transform:translateX(-50%);filter:drop-shadow(0 7px 4px rgb(0 58 76/.28));transition:left 6.8s ease-in-out,bottom 1s ease,scale .8s ease;will-change:left,bottom,scale}.traveler.yejji{background-image:url('assets/yejji-snorkel-v2.png');left:25%;bottom:-1%}.traveler.hanwon{background-image:url('assets/hanwon-snorkel-v1.png');left:40%;bottom:-2%;width:clamp(102px,16vw,180px)}.traveler.walk-right{background-position:0 0}.traveler.walk-left{background-position:100% 0}.traveler.swim{background-position:0 100%;scale:.78;animation:float 1.9s ease-in-out infinite}.traveler.wave{background-position:100% 100%}.traveler.bob{animation:bob .52s steps(2) infinite}
.water-surface{position:absolute;z-index:5;left:-3%;right:-3%;top:55%;height:25%;opacity:0;pointer-events:none;background:linear-gradient(180deg,rgb(130 245 235/.08),rgb(15 160 190/.32)),repeating-radial-gradient(ellipse at 48% 0,transparent 0 24px,rgb(235 255 255/.42) 26px 28px,transparent 30px 52px);mask-image:linear-gradient(transparent,#000 20%,#000 82%,transparent);transform:skewY(-1deg);transition:opacity .6s ease}.miyako.snorkeling .water-surface{opacity:1;animation:waterShimmer 3.4s ease-in-out infinite alternate}
.bubble{position:absolute;z-index:3;bottom:35%;width:8px;aspect-ratio:1;border:2px solid rgb(229 255 255/.9);border-radius:50%;opacity:0}.miyako.snorkeling .bubble{animation:bubbles 3.2s ease-in infinite}.bubble.b1{left:34%;animation-delay:.2s!important}.bubble.b2{left:53%;width:11px;animation-delay:1.1s!important}.bubble.b3{left:66%;width:6px;animation-delay:2s!important}
.burger-walker{position:absolute;z-index:4;bottom:-2%;width:clamp(102px,16vw,180px);aspect-ratio:1;background:url('assets/yejji-hanwon-burger-walk-v1.png') 0 0/200% 200% no-repeat;opacity:0;transform:translateX(-50%);filter:drop-shadow(0 7px 4px rgb(70 45 12/.25));transition:left 6.8s ease-in-out,opacity .35s ease;will-change:left}.burger-walker.yejji{left:24%}.burger-walker.hanwon{left:38%}.burger-walker.yejji.right{background-position:0 0}.burger-walker.yejji.left{background-position:100% 0}.burger-walker.hanwon.right{background-position:0 100%}.burger-walker.hanwon.left{background-position:100% 100%}.burger-zone .burger-walker{opacity:1}.burger-zone.eating .burger-walker{opacity:0}.burger-meal{position:absolute;z-index:4;right:1%;bottom:-4%;width:min(58%,620px);aspect-ratio:3/2;background:url('assets/yejji-hanwon-burger-meal-v1.png') center/contain no-repeat;opacity:0;scale:.92;transform-origin:bottom right;filter:drop-shadow(0 10px 8px rgb(50 28 7/.22));transition:opacity .45s ease,scale .55s ease}.burger-zone.eating .burger-meal{opacity:1;scale:1;animation:mealPop .55s ease-out}.burger-zone .traveler,.burger-zone .water-surface,.burger-zone .bubble{opacity:0!important;animation:none!important}
.runway-walker{position:absolute;z-index:4;bottom:-2%;width:clamp(105px,17vw,188px);aspect-ratio:1;background:url('assets/yejji-hanwon-runway-walk-v1.png') 0 0/200% 200% no-repeat;opacity:0;transform:translateX(-50%);filter:drop-shadow(0 8px 5px rgb(52 29 55/.28));transition:left 7.2s ease-in-out,opacity .35s ease;will-change:left}.runway-walker.yejji{left:57%}.runway-walker.hanwon{left:70%}.runway-walker.yejji.right{background-position:0 0}.runway-walker.yejji.left{background-position:100% 0}.runway-walker.hanwon.right{background-position:0 100%}.runway-walker.hanwon.left{background-position:100% 100%}.runway-zone .runway-walker{opacity:1}.runway-zone .traveler,.runway-zone .burger-walker,.runway-zone .burger-meal,.runway-zone .water-surface,.runway-zone .bubble{opacity:0!important;animation:none!important}
.performance-audience{position:absolute;z-index:4;left:5%;bottom:-4%;width:min(47%,500px);aspect-ratio:3/2;background:url('assets/yejji-hanwon-performance-audience-v1.png') center/contain no-repeat;opacity:0;transform-origin:bottom center;filter:drop-shadow(0 11px 7px rgb(45 19 5/.35));transition:opacity .4s ease,scale .45s ease}.performance-zone .performance-audience{opacity:1;animation:audienceClap 1.35s ease-in-out infinite}.performance-zone .traveler,.performance-zone .burger-walker,.performance-zone .burger-meal,.performance-zone .runway-walker,.performance-zone .water-surface,.performance-zone .bubble{opacity:0!important;animation:none!important}.performance-zone.photo-moment .performance-audience{animation:audiencePhoto .7s ease-out}
.turtle-hanwon,.turtle-yejji{position:absolute;z-index:4;bottom:-2%;aspect-ratio:1;opacity:0;transform:translateX(-50%);transition:left 6.8s ease-in-out,opacity .4s ease;will-change:left}.turtle-hanwon{left:70%;width:clamp(120px,20vw,220px);background:url('assets/hanwon-blue-polo-cafe-v1.png') 0 0/200% 200% no-repeat;filter:drop-shadow(0 9px 5px rgb(8 57 55/.3))}.turtle-yejji{left:57%;width:clamp(112px,18vw,198px);background:url('assets/yejji-hanwon-runway-walk-v1.png') 0 0/200% 200% no-repeat;filter:drop-shadow(0 9px 5px rgb(8 57 55/.26))}.turtle-zone .turtle-hanwon,.turtle-zone .turtle-yejji{opacity:1}.turtle-hanwon.photo{background-position:0 0}.turtle-hanwon.rest{background-position:100% 0}.turtle-hanwon.walk-right{background-position:0 100%}.turtle-hanwon.walk-left{background-position:100% 100%}.turtle-yejji.photo,.turtle-yejji.walk-right{background-position:0 0}.turtle-yejji.rest,.turtle-yejji.walk-left{background-position:100% 0}.turtle-hanwon.snap,.turtle-yejji.snap{animation:turtleSnap .75s ease-out}.turtle-zone .traveler,.turtle-zone .burger-walker,.turtle-zone .burger-meal,.turtle-zone .runway-walker,.turtle-zone .performance-audience,.turtle-zone .water-surface,.turtle-zone .bubble{opacity:0!important;animation:none!important}
@keyframes bob{50%{translate:0 -3px}}@keyframes float{50%{translate:0 -3px;rotate:-1deg}}@keyframes mealPop{0%{translate:0 12px;scale:.92}100%{translate:0 0;scale:1}}@keyframes audienceClap{50%{translate:0 -2px;rotate:-.35deg}}@keyframes audiencePhoto{0%{filter:drop-shadow(0 11px 7px rgb(45 19 5/.35)) brightness(1)}25%{filter:drop-shadow(0 11px 7px rgb(45 19 5/.35)) brightness(1.75)}100%{filter:drop-shadow(0 11px 7px rgb(45 19 5/.35)) brightness(1)}}@keyframes turtleSnap{0%{filter:drop-shadow(0 9px 5px rgb(8 57 55/.3)) brightness(1)}22%{filter:drop-shadow(0 9px 5px rgb(8 57 55/.3)) brightness(1.75);scale:1.03}100%{filter:drop-shadow(0 9px 5px rgb(8 57 55/.3)) brightness(1);scale:1}}@keyframes waterShimmer{50%{translate:1.5% 2px;opacity:.8}}@keyframes bubbles{0%{opacity:0;translate:0 0}20%{opacity:.9}100%{opacity:0;translate:12px -90px}}
.flash{position:absolute;z-index:7;width:22px;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 32px 16px #fff8b4;opacity:0;pointer-events:none}.flash.on{animation:flash .65s ease-out}@keyframes flash{0%,15%{opacity:1;scale:.3}100%{opacity:0;scale:3}}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:14px}.controls button{border:1px solid rgb(255 255 255/.18);border-radius:999px;padding:10px 16px;background:rgb(255 255 255/.1);color:var(--cream);font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgb(0 0 0/.15)}.controls button[hidden]{display:none}.controls button:hover,.controls button:focus-visible{background:var(--gold);color:#33210a;outline:none}.status{text-align:center;min-height:24px;margin:9px 0 0;color:#c7e7f1;font-size:13px}
@media(max-width:560px){body{padding:10px;overflow-x:hidden}main{width:100%;max-width:calc(100vw - 20px)}.top{align-items:center}.back{font-size:12px;padding:7px 10px}.destinations{margin-bottom:9px}.tab{font-size:12px;padding:8px 11px}.spot-tabs{justify-content:flex-start;margin-bottom:8px}.spot-tabs button{font-size:11px;padding:7px 10px}.scene{border-radius:17px;aspect-ratio:4/3}.caption{max-width:66%;padding:8px 10px}.weather{font-size:10px;padding:6px 8px}.yejji-shanghai{width:clamp(86px,28vw,126px);bottom:0}.traveler{width:clamp(96px,28vw,132px)}.traveler.hanwon{width:clamp(91px,26vw,124px)}.traveler.swim{scale:.74}.water-surface{top:54%;height:27%}.burger-walker{width:clamp(90px,26vw,122px);bottom:-1%}.burger-meal{width:72%;right:-4%;bottom:-1%}.runway-zone{background-position:58% center}.runway-walker{width:clamp(94px,27vw,128px);bottom:-1%}.performance-zone{background-position:58% center}.performance-audience{left:-3%;bottom:-1%;width:59%}.turtle-zone{background-position:54% center}.turtle-hanwon{width:clamp(90px,25vw,110px);bottom:-1%}.turtle-yejji{width:clamp(84px,24vw,105px);bottom:-1%}.controls{gap:7px}.controls button{font-size:12px;padding:9px 12px}}
@media(prefers-reduced-motion:reduce){.yejji-shanghai,.traveler,.turtle-hanwon,.turtle-yejji{transition:none}.bob,.traveler.swim,.miyako.snorkeling .bubble,.miyako.snorkeling .water-surface,.performance-zone .performance-audience,.turtle-hanwon.snap,.turtle-yejji.snap{animation:none!important}}
</style>
<body>
<main>
  <header class="top"><div><p class="eyebrow">YEJJI & HANWON'S TRAVEL LOG</p><h1 id="page-title">동방명주에서, 예찌</h1></div><a class="back" href="../office/">← Office</a></header>
  <nav class="destinations" role="tablist" aria-label="여행지 선택">
    <a class="tab" id="tab-shanghai" role="tab" aria-controls="panel-shanghai" aria-selected="true" href="#shanghai">🌃 상하이</a>
    <a class="tab" id="tab-miyakojima" role="tab" aria-controls="panel-miyakojima" aria-selected="false" href="#miyakojima">🐠 미야코지마</a>
  </nav>
  <section class="panel" id="panel-shanghai" role="tabpanel" aria-labelledby="tab-shanghai">
    <div class="scene shanghai" id="shanghai-scene" aria-label="동방명주와 황푸강 야경을 배경으로 예찌가 관광하는 2D 화면"><div class="caption"><b>Shanghai · The Bund</b><span>황푸강 너머 반짝이는 동방명주를 바라보는 저녁</span></div><div class="yejji-shanghai right bob" id="shanghai-yejji" data-outfit="winter" role="img" aria-label="아이보리 코트를 입고 상하이를 관광하는 예찌"></div><div class="flash" id="flash"></div></div>
    <nav class="controls" aria-label="상하이 관광 동작"><button type="button" data-shanghai="walk">🚶 산책하기</button><button type="button" data-shanghai="pose">📷 여행 포즈</button><button type="button" data-shanghai="wave">👋 손 흔들기</button><button type="button" data-shanghai="outfit">🧥 코디 바꾸기</button></nav><p class="status" id="shanghai-status" aria-live="polite">예찌가 와이탄 산책로를 걷고 있어요.</p>
  </section>
  <section class="panel" id="panel-miyakojima" role="tabpanel" aria-labelledby="tab-miyakojima" hidden>
    <nav class="spot-tabs" aria-label="미야코지마 장소 선택"><button type="button" data-spot="turtle" aria-pressed="false">🐢 터틀 카페</button><button type="button" data-spot="runway" aria-pressed="false">🌅 활주로 노을</button><button type="button" data-spot="performance" aria-pressed="false">🎭 섬 공연</button><button type="button" data-spot="burger" aria-pressed="false">🍔 햄버거 존</button><button type="button" data-spot="beach" aria-pressed="true">🏖️ 바닷가</button></nav>
    <div class="scene miyako" id="miyako-scene" aria-label="미야코지마에서 예찌와 한원이 여행하는 2D 화면"><div class="caption"><b id="miyako-caption-title">Miyakojima · Okinawa</b><span id="miyako-caption-copy">산호빛 얕은 바다를 함께 헤엄치고 걷는 여름날</span></div><div class="weather" id="miyako-weather">☀ 28°C · 물빛 최고</div><div class="traveler yejji walk-right bob" id="miyako-yejji" role="img" aria-label="중간 길이 웨이브 머리와 코랄 래시가드로 스노클링을 즐기는 예찌"></div><div class="traveler hanwon walk-right bob" id="miyako-hanwon" role="img" aria-label="네이비 래시가드를 입고 스노클링을 즐기는 한원"></div><div class="burger-walker yejji right bob" id="burger-yejji" role="img" aria-label="산호색 여름 셔츠를 입고 햄버거 존을 걷는 예찌"></div><div class="burger-walker hanwon right bob" id="burger-hanwon" role="img" aria-label="네이비 여름 셔츠를 입고 햄버거 존을 걷는 한원"></div><div class="burger-meal" role="img" aria-label="야외 피크닉 테이블에서 수제 햄버거와 감자튀김을 먹는 예찌와 한원"></div><div class="runway-walker yejji right bob" id="runway-yejji" role="img" aria-label="파란 꽃무늬 원피스와 흰 숄을 입고 활주로 해안을 걷는 예찌"></div><div class="runway-walker hanwon right bob" id="runway-hanwon" role="img" aria-label="아이보리 리넨 셔츠를 입고 활주로 해안을 걷는 한원"></div><div class="performance-audience" role="img" aria-label="파란 꽃무늬 원피스의 예찌와 아이보리 셔츠의 한원이 나란히 앉아 섬 공연을 보며 박수치는 모습"></div><div class="turtle-yejji photo" id="turtle-yejji" role="img" aria-label="파란 꽃무늬 원피스와 흰 숄을 입고 터틀 카페 앞에서 한원과 여행 사진을 남기는 예찌"></div><div class="turtle-hanwon photo" id="turtle-hanwon" role="img" aria-label="네이비 폴로 반팔 셔츠와 베이지 반바지를 입고 터틀 카페 앞에서 예찌와 여행 사진을 남기는 한원"></div><div class="water-surface" aria-hidden="true"></div><i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i></div>
    <nav class="controls" aria-label="미야코지마 여행 동작"><button type="button" data-zone="beach" data-miyako="walk">🏝️ 해변 산책</button><button type="button" data-zone="beach" data-miyako="snorkel">🤿 같이 스노클링</button><button type="button" data-zone="beach" data-miyako="wave">👋 바다에서 인사</button><button type="button" data-zone="runway" data-miyako="runway-walk" hidden>🌅 노을 산책</button><button type="button" data-zone="burger" data-miyako="burger-walk" hidden>🚶 햄버거 존 산책</button><button type="button" data-zone="burger" data-miyako="burger-eat" hidden>🍔 수제 햄버거</button><button type="button" data-zone="performance" data-miyako="performance-clap" hidden>👏 공연 관람</button><button type="button" data-zone="performance" data-miyako="performance-photo" hidden>📷 추억 남기기</button><button type="button" data-zone="turtle" data-miyako="turtle-photo" hidden>📷 여행 한컷</button><button type="button" data-zone="turtle" data-miyako="turtle-rest" hidden>☕ 카페에서 쉬기</button><button type="button" data-zone="turtle" data-miyako="turtle-walk" hidden>🌴 바다 쪽 산책</button></nav><p class="status" id="miyako-status" aria-live="polite">예찌와 한원이 미야코지마 해변을 천천히 걷고 있어요.</p>
  </section>
</main>
<script>
const destinations={shanghai:{title:'동방명주에서, 예찌'},miyakojima:{title:'미야코지마에서, 예찌 & 한원'}};
function selectDestination(name){if(!destinations[name])name='shanghai';Object.keys(destinations).forEach(key=>{const active=key===name;document.getElementById('tab-'+key).setAttribute('aria-selected',String(active));document.getElementById('panel-'+key).hidden=!active});document.getElementById('page-title').textContent=destinations[name].title;document.title=destinations[name].title+' · Travel Log'}
addEventListener('hashchange',()=>selectDestination(location.hash.slice(1)));selectDestination(location.hash.slice(1));
const sy=document.getElementById('shanghai-yejji'),ss=document.getElementById('shanghai-status'),flash=document.getElementById('flash');let stimer=0,sright=false,outfit='winter';
function shanghaiPose(name,text){clearTimeout(stimer);sy.className='yejji-shanghai '+name;ss.textContent=text}
function shanghaiWalk(){clearTimeout(stimer);sright=!sright;sy.className='yejji-shanghai '+(sright?'right':'left')+' bob';sy.style.left=sright?'76%':'18%';ss.textContent='예찌가 황푸강 바람을 맞으며 산책하고 있어요.';stimer=setTimeout(shanghaiWalk,5000)}
function travelPose(){shanghaiPose('photo',outfit==='winter'?'예찌가 아이보리 코트 주머니에 손을 넣고 동방명주 야경을 바라봐요.':'찰칵! 동방명주 야경을 여행 사진으로 남겼어요.');if(outfit==='classic'){const r=sy.getBoundingClientRect(),s=document.getElementById('shanghai-scene').getBoundingClientRect();flash.style.left=(r.left-s.left+r.width*.54)+'px';flash.style.top=(r.top-s.top+r.height*.37)+'px';flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on')}}
function changeOutfit(){outfit=outfit==='winter'?'classic':'winter';sy.dataset.outfit=outfit;shanghaiPose('wave',outfit==='winter'?'아이보리 코트와 퍼 모자 코디로 갈아입었어요.':'차콜 롱코트 여행 코디로 갈아입었어요.')}
document.querySelector('[aria-label="상하이 관광 동작"]').addEventListener('click',e=>{const a=e.target.dataset.shanghai;if(a==='walk')shanghaiWalk();if(a==='pose')travelPose();if(a==='wave')shanghaiPose('wave','예찌가 동방명주를 배경으로 반갑게 손을 흔들어요.');if(a==='outfit')changeOutfit()});
const my=document.getElementById('miyako-yejji'),mh=document.getElementById('miyako-hanwon'),by=document.getElementById('burger-yejji'),bh=document.getElementById('burger-hanwon'),ry=document.getElementById('runway-yejji'),rh=document.getElementById('runway-hanwon'),ty=document.getElementById('turtle-yejji'),th=document.getElementById('turtle-hanwon'),ms=document.getElementById('miyako-status'),mScene=document.getElementById('miyako-scene'),mTitle=document.getElementById('miyako-caption-title'),mCopy=document.getElementById('miyako-caption-copy'),mWeather=document.getElementById('miyako-weather');let mtimer=0,mright=false,bright=false,rright=false,tright=false;
function setTravelers(yClass,hClass){my.className='traveler yejji '+yClass;mh.className='traveler hanwon '+hClass}
function setSpotUI(name){document.querySelectorAll('[data-spot]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.spot===name)));document.querySelectorAll('[data-zone]').forEach(b=>b.hidden=b.dataset.zone!==name)}
function seaMode(){setSpotUI('beach');mScene.className='scene miyako';mTitle.textContent='Miyakojima · Beach';mCopy.textContent='산호빛 얕은 바다를 함께 헤엄치고 걷는 여름날';mWeather.textContent='☀ 28°C · 물빛 최고'}
function burgerMode(eating=false){setSpotUI('burger');mScene.className='scene miyako burger-zone'+(eating?' eating':'');mTitle.textContent='Miyakojima · Burger Zone';mCopy.textContent=eating?'산책 뒤 피크닉 테이블에서 즐기는 갓 만든 수제 햄버거':'노란 푸드트럭과 야자수 사이를 걷는 맛있는 오후';mWeather.textContent=eating?'🍔 오늘의 수제 버거':'🌴 햇살 좋은 산책길'}
function runwayMode(){setSpotUI('runway');mScene.className='scene miyako runway-zone';mTitle.textContent='Shimojishima · Runway Sunset';mCopy.textContent='바다와 활주로 끝을 물들이는 노을을 따라 걷는 저녁';mWeather.textContent='🌅 19:02 · 노을 산책'}
function performanceMode(photo=false){clearTimeout(mtimer);setSpotUI('performance');mScene.className='scene miyako performance-zone'+(photo?' photo-moment':'');mTitle.textContent='Miyakojima · Island Performance';mCopy.textContent='따뜻한 목조 무대에서 만나는 유쾌한 오키나와의 밤';mWeather.textContent='🎭 20:10 · 공연 중';ms.textContent=photo?'찰칵! 예찌가 공연의 즐거운 순간을 여행 사진으로 남겨요.':'예찌와 한원이 앞자리에 나란히 앉아 웃으며 박수를 쳐요.'}
function turtleMode(pose='photo'){clearTimeout(mtimer);setSpotUI('turtle');mScene.className='scene miyako turtle-zone';mTitle.textContent='Miyakojima · Blue Turtle Cafe';mCopy.textContent='야자수 사이로 열린 에메랄드 바다와 하얀 카페의 한낮';mWeather.textContent='🐢 27°C · 카페 바람';const extra=pose==='photo'?' snap':'',mobile=matchMedia('(max-width:560px)').matches;ty.className='turtle-yejji '+pose+extra;th.className='turtle-hanwon '+pose+extra;ty.style.left=pose==='rest'?(mobile?'42%':'43%'):(mobile?'53%':'57%');th.style.left=pose==='rest'?(mobile?'20%':'29%'):(mobile?'75%':'70%');ms.textContent=pose==='rest'?'예찌와 한원이 바닷바람이 드는 카페 테라스에서 함께 쉬어가요.':'찰칵! 예찌와 한원이 터틀 카페 앞에서 여행 한컷을 함께 남겨요.'}
function miyakoWalk(){clearTimeout(mtimer);seaMode();mright=!mright;setTravelers((mright?'walk-right':'walk-left')+' bob',(mright?'walk-right':'walk-left')+' bob');my.style.left=mright?'72%':'22%';mh.style.left=mright?'86%':'36%';my.style.bottom='-1%';mh.style.bottom='-2%';ms.textContent='예찌와 한원이 에메랄드빛 물가를 나란히 산책해요.';mtimer=setTimeout(miyakoWalk,7200)}
function snorkel(){clearTimeout(mtimer);seaMode();mScene.classList.add('snorkeling');setTravelers('swim','swim');my.style.left='41%';mh.style.left='63%';my.style.bottom='26%';mh.style.bottom='23%';ms.textContent='첨벙! 두 사람이 몸을 물속에 담그고 맑은 산호 바다를 함께 탐험해요.'}
function miyakoWave(){clearTimeout(mtimer);seaMode();setTravelers('wave','wave');my.style.left='40%';mh.style.left='61%';my.style.bottom='-1%';mh.style.bottom='-2%';ms.textContent='예찌와 한원이 미야코지마 바다에서 반갑게 손을 흔들어요.'}
function burgerWalk(){clearTimeout(mtimer);burgerMode();bright=!bright;const dir=bright?'right':'left';by.className='burger-walker yejji '+dir+' bob';bh.className='burger-walker hanwon '+dir+' bob';by.style.left=bright?'61%':'17%';bh.style.left=bright?'75%':'31%';ms.textContent='예찌와 한원이 노란 푸드트럭을 구경하며 햄버거 존을 산책해요.';mtimer=setTimeout(burgerWalk,7200)}
function eatBurger(){clearTimeout(mtimer);burgerMode(true);ms.textContent='냠! 두 사람이 갓 만든 수제 햄버거와 바삭한 감자튀김을 맛있게 먹어요.'}
function runwayWalk(){clearTimeout(mtimer);runwayMode();rright=!rright;const dir=rright?'right':'left';ry.className='runway-walker yejji '+dir+' bob';rh.className='runway-walker hanwon '+dir+' bob';ry.style.left=rright?'76%':'51%';rh.style.left=rright?'89%':'64%';ms.textContent='예찌와 한원이 분홍빛 노을과 바닷바람을 맞으며 활주로 해안을 걸어요.';mtimer=setTimeout(runwayWalk,7600)}
function turtleWalk(){clearTimeout(mtimer);turtleMode(tright?'walk-left':'walk-right');tright=!tright;const mobile=matchMedia('(max-width:560px)').matches;ty.style.left=tright?(mobile?'62%':'68%'):(mobile?'16%':'32%');th.style.left=tright?(mobile?'84%':'82%'):(mobile?'38%':'46%');ms.textContent='예찌와 한원이 야자수 그늘을 지나 에메랄드빛 바다 쪽으로 나란히 걸어요.';mtimer=setTimeout(turtleWalk,7200)}
document.querySelector('[aria-label="미야코지마 장소 선택"]').addEventListener('click',e=>{const s=e.target.dataset.spot;if(s==='beach')miyakoWalk();if(s==='runway')runwayWalk();if(s==='burger')burgerWalk();if(s==='performance')performanceMode();if(s==='turtle')turtleMode()});
document.querySelector('[aria-label="미야코지마 여행 동작"]').addEventListener('click',e=>{const a=e.target.dataset.miyako;if(a==='walk')miyakoWalk();if(a==='snorkel')snorkel();if(a==='runway-walk')runwayWalk();if(a==='burger-walk')burgerWalk();if(a==='burger-eat')eatBurger();if(a==='performance-clap')performanceMode();if(a==='performance-photo')performanceMode(true);if(a==='turtle-photo')turtleMode();if(a==='turtle-rest')turtleMode('rest');if(a==='turtle-walk')turtleWalk();if(a==='wave')miyakoWave()});
if(matchMedia('(prefers-reduced-motion: reduce)').matches){shanghaiPose('wave','예찌가 동방명주 야경을 감상하고 있어요.');miyakoWave()}else{stimer=setTimeout(shanghaiWalk,1200);mtimer=setTimeout(miyakoWalk,1600)}
</script>
</html>
