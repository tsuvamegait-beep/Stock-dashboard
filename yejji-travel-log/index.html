<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2854">
<title>예찌의 상하이 여행</title>
<style>
:root{--navy:#0b2854;--night:#071a35;--cream:#fff7e8;--gold:#ffc469;--coral:#ff7b78;--glass:rgb(7 26 53/.72);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--cream)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 5%,#244f88 0,var(--night) 55%);display:grid;place-items:start center;padding:18px}
main{width:min(1080px,100%)}
.top{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 4px 12px}.eyebrow{margin:0;color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.12em}.top h1{margin:2px 0 0;font-size:clamp(22px,4vw,38px);letter-spacing:-.04em}.back{color:var(--cream);text-decoration:none;border:1px solid rgb(255 255 255/.24);background:rgb(255 255 255/.08);padding:9px 13px;border-radius:999px;white-space:nowrap}
.scene{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:#183d69 url('assets/oriental-pearl-promenade-v1.png') center/cover no-repeat;box-shadow:0 30px 80px rgb(0 0 0/.45),inset 0 0 0 1px rgb(255 255 255/.18);isolation:isolate}
.scene::after{content:"";position:absolute;inset:auto 0 0;height:38%;background:linear-gradient(transparent,rgb(2 10 25/.22));pointer-events:none;z-index:1}
.caption{position:absolute;z-index:4;left:3%;top:4%;max-width:48%;padding:11px 14px;border:1px solid rgb(255 255 255/.2);border-radius:15px;background:var(--glass);backdrop-filter:blur(10px);box-shadow:0 8px 24px rgb(0 0 0/.2)}.caption b{display:block;font-size:clamp(14px,2vw,20px)}.caption span{font-size:clamp(10px,1.3vw,13px);color:#d9e8ff}
.yejji{--x:18%;position:absolute;z-index:3;left:var(--x);bottom:2.5%;width:clamp(100px,17vw,184px);aspect-ratio:1;background-image:url('assets/yejji-winter-ivory-tourist-v2.png');background-repeat:no-repeat;background-size:200% 200%;background-position:0 0;filter:drop-shadow(0 8px 5px rgb(0 0 0/.3));transform:translateX(-50%);transition:left 4.8s linear;will-change:left}
.yejji[data-outfit="classic"]{background-image:url('assets/yejji-shanghai-tourist-v1.png')}
.yejji.right{background-position:0 0}.yejji.left{background-position:100% 0}.yejji.photo{background-position:0 100%}.yejji.wave{background-position:100% 100%}.yejji.walking{animation:bob .48s steps(2) infinite}@keyframes bob{50%{translate:0 -3px}}
.flash{position:absolute;z-index:5;width:22px;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 32px 16px #fff8b4;opacity:0;pointer-events:none}.flash.on{animation:flash .65s ease-out}@keyframes flash{0%,15%{opacity:1;scale:.3}100%{opacity:0;scale:3}}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:14px}.controls button{border:1px solid rgb(255 255 255/.18);border-radius:999px;padding:10px 16px;background:rgb(255 255 255/.1);color:var(--cream);font:700 14px inherit;cursor:pointer;box-shadow:0 6px 16px rgb(0 0 0/.15)}.controls button:hover,.controls button:focus-visible{background:var(--gold);color:#33210a;outline:none}.status{text-align:center;min-height:24px;margin:9px 0 0;color:#c7d9f3;font-size:13px}
@media(max-width:560px){body{padding:10px}.top{align-items:center}.back{font-size:12px;padding:7px 10px}.scene{border-radius:17px;aspect-ratio:4/3;background-position:center}.caption{max-width:67%}.yejji{width:clamp(86px,28vw,126px);bottom:0}.controls{gap:7px}.controls button{font-size:12px;padding:9px 12px}}
@media(prefers-reduced-motion:reduce){.yejji{transition:none}.yejji.walking{animation:none}}
</style>
<body>
<main>
  <header class="top"><div><p class="eyebrow">YEJJI'S TRAVEL LOG</p><h1>동방명주에서, 예찌</h1></div><a class="back" href="../office/">← Office</a></header>
  <section class="scene" id="scene" aria-label="동방명주와 황푸강 야경을 배경으로 예찌가 관광하는 2D 도트 화면">
    <div class="caption"><b>Shanghai · The Bund</b><span>황푸강 너머 반짝이는 동방명주를 바라보는 저녁</span></div>
    <div class="yejji right walking" id="yejji" data-outfit="winter" role="img" aria-label="레오퍼드 퍼 모자와 아이보리 코트를 입고 상하이를 관광하는 예찌"></div>
    <div class="flash" id="flash"></div>
  </section>
  <nav class="controls" aria-label="예찌 관광 동작">
    <button type="button" data-act="walk">🚶 산책하기</button>
    <button type="button" data-act="pose">📷 여행 포즈</button>
    <button type="button" data-act="wave">👋 손 흔들기</button>
    <button type="button" data-act="outfit">🧥 코디 바꾸기</button>
  </nav>
  <p class="status" id="status" aria-live="polite">예찌가 와이탄 산책로를 걷고 있어요.</p>
</main>
<script>
const y=document.getElementById('yejji'),status=document.getElementById('status'),flash=document.getElementById('flash');
let timer=0,atRight=false,outfit='winter';
function pose(name,text){clearTimeout(timer);y.className='yejji '+name;status.textContent=text}
function walk(){clearTimeout(timer);atRight=!atRight;y.className='yejji '+(atRight?'right':'left')+' walking';y.style.left=atRight?'76%':'18%';status.textContent='예찌가 황푸강 바람을 맞으며 산책하고 있어요.';timer=setTimeout(walk,5000)}
function travelPose(){pose('photo',outfit==='winter'?'예찌가 아이보리 코트 주머니에 손을 넣고 동방명주 야경을 바라봐요.':'찰칵! 동방명주 야경을 여행 사진으로 남겼어요.');if(outfit==='classic'){const r=y.getBoundingClientRect(),s=document.getElementById('scene').getBoundingClientRect();flash.style.left=(r.left-s.left+r.width*.54)+'px';flash.style.top=(r.top-s.top+r.height*.37)+'px';flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on')}}
function changeOutfit(){outfit=outfit==='winter'?'classic':'winter';y.dataset.outfit=outfit;y.setAttribute('aria-label',outfit==='winter'?'레오퍼드 퍼 모자와 아이보리 코트를 입고 상하이를 관광하는 예찌':'선글라스와 차콜 코트를 입고 상하이를 관광하는 예찌');pose('wave',outfit==='winter'?'사진 속 아이보리 코트와 퍼 모자 코디로 갈아입었어요.':'차콜 롱코트 여행 코디로 갈아입었어요.')}
document.querySelector('.controls').addEventListener('click',e=>{const a=e.target.dataset.act;if(!a)return;if(a==='walk')walk();if(a==='pose')travelPose();if(a==='wave')pose('wave','예찌가 동방명주를 배경으로 반갑게 손을 흔들어요.');if(a==='outfit')changeOutfit()});
if(matchMedia('(prefers-reduced-motion: reduce)').matches)pose('wave','예찌가 동방명주 야경을 감상하고 있어요.');else timer=setTimeout(walk,1200);
</script>
</html>
